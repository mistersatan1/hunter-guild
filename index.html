<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>헌터 길드 매니저 — 프로토타입</title>
<style>
:root{
  --bg:#141A1F;
  --panel:#1C242B;
  --panel2:#222C34;
  --line:#2E3A44;
  --line2:#3D4C58;
  --text:#E6E9E6;
  --dim:#8DA0A9;
  --dim2:#647680;
  --brass:#C9A227;
  --brass-d:#8C7018;
  --blood:#C0504A;
  --moss:#6F9E5A;
  --arc:#7B8FCB;
  --r:3px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  font-size:15px;line-height:1.55;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}

/* ── 상단 ── */
#top{
  position:sticky;top:0;z-index:20;background:var(--panel);
  border-bottom:1px solid var(--line);
  padding:10px 14px 9px;
  display:flex;align-items:baseline;gap:10px;
}
#top .gname{font-weight:700;font-size:15px;letter-spacing:-.01em}
#top .grade{
  color:var(--brass);border:1px solid var(--brass-d);border-radius:2px;
  font-size:11px;font-weight:700;padding:1px 5px;position:relative;top:-1px
}
#top .gold{margin-left:auto;color:var(--brass);font-weight:700;font-size:14px}
#top .date{font-size:12px;color:var(--dim2)}

/* ── 본문 ── */
#view{flex:1;padding:14px 14px 96px}
.sec{margin-bottom:22px}
.sec>h2{
  font-size:12px;font-weight:600;color:var(--dim);margin:0 0 8px;
  letter-spacing:.02em;display:flex;align-items:center;gap:8px
}
.sec>h2::after{content:"";flex:1;height:1px;background:var(--line)}

/* ── 홈 히어로 ── */
.hero{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:16px;
}
.hero .d1{font-size:12px;color:var(--dim2)}
.hero .d2{font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:1px 0 10px}
.hero .d2 em{font-style:normal;font-size:16px;font-weight:600;color:var(--dim);margin-left:7px}
.adv{display:flex;gap:6px}
.adv button{
  flex:1;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);
  padding:10px 4px;font-size:13px;font-weight:600;transition:background .12s
}
.adv button.main{background:var(--brass);border-color:var(--brass);color:#181203;font-weight:700}
.adv button:active{filter:brightness(1.18)}

/* ── 명성 ── */
.reps{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px}
.rep{font-size:12px}
.rep .rl{display:flex;justify-content:space-between;color:var(--dim);margin-bottom:3px}
.rep .rl b{color:var(--text);font-weight:600}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass)}

/* ── 파견 현황 ── */
.dispatch{
  border-left:2px solid var(--brass);background:var(--panel);
  padding:9px 11px;margin-bottom:6px;border-radius:0 var(--r) var(--r) 0
}
.dispatch .t{font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.dispatch .t span{color:var(--brass);font-size:12px;white-space:nowrap}
.dispatch .m{font-size:12px;color:var(--dim);margin-top:2px}

/* ── 목록(장부형) ── */
.ledger{border-top:1px solid var(--line)}
.row{
  border-bottom:1px solid var(--line);padding:10px 2px;
  display:flex;align-items:center;gap:10px;width:100%;text-align:left
}
.row:active{background:var(--panel)}
.row .ic{font-size:17px;width:22px;text-align:center;flex:none}
.row .mid{flex:1;min-width:0}
.row .n{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .s{font-size:12px;color:var(--dim);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt{text-align:right;flex:none;font-size:12px;color:var(--dim)}
.row .rt b{display:block;font-size:14px;color:var(--text);font-weight:700}

/* ── 의뢰 카드 ── */
.quest{
  display:block;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-left-width:3px;border-radius:0 var(--r) var(--r) 0;
  padding:11px 12px;margin-bottom:7px
}
.quest:active{background:var(--panel2)}
.quest .qh{display:flex;align-items:baseline;gap:7px}
.quest .qt{font-size:14px;font-weight:600;flex:1}
.quest .qr{color:var(--brass);font-weight:700;font-size:13px;white-space:nowrap}
.quest .qm{display:flex;gap:9px;font-size:12px;color:var(--dim);margin-top:4px;flex-wrap:wrap}
.stars{color:var(--brass);letter-spacing:1px;font-size:12px}
.stars .u{color:var(--dim2)}
.q-c{border-left-color:var(--blood)}
.q-g{border-left-color:var(--moss)}
.q-e{border-left-color:var(--brass)}
.q-a{border-left-color:var(--arc)}

/* ── 문장 ── */
.sig{display:block;flex:none}
.row .sig{margin-right:-2px}

/* ── 오늘의 상황 ── */
.brief{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 12px;margin-bottom:12px}
.brief .bi{display:flex;gap:8px;align-items:baseline;font-size:12.5px;padding:3px 0}
.brief .bi .bk{flex:none;width:16px;text-align:center}
.brief .bi .bt{flex:1;color:var(--dim)}
.brief .bi.hot .bt{color:#E4A9A4}
.brief .bi .bv{color:var(--text);font-weight:600;white-space:nowrap}
.brief .nx{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:8px;font-size:12.5px}
.brief .nx b{color:var(--brass)}
.brief .nx button{margin-left:auto;background:var(--panel2);border:1px solid var(--line2);
  border-radius:var(--r);padding:5px 11px;font-size:12px;font-weight:600;white-space:nowrap}

/* ── 관계 ── */
.rel-l{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.rel-l .rn{flex:1}
.rel-l .rb{width:52px;height:3px;background:var(--line);border-radius:2px;position:relative;overflow:hidden}
.rel-l .rb i{position:absolute;top:0;height:100%;background:var(--dim)}

/* ── 지도 ── */
.map{position:relative;width:100%;aspect-ratio:16/11;margin-bottom:12px;
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#131A1E}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.mk{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:0;background:none;border:0;white-space:nowrap
}
.mk .dot{
  width:9px;height:9px;border-radius:50%;background:var(--dim2);
  border:1.5px solid #131A1E;box-shadow:0 0 0 1px var(--line2)
}
.mk .lb{font-size:8.5px;color:var(--dim2);letter-spacing:-.02em;line-height:1}
.mk.q .dot{background:var(--brass);box-shadow:0 0 0 1px var(--brass-d)}
.mk.q .lb{color:var(--brass)}
.mk.t .dot{width:13px;height:13px;background:var(--blood);box-shadow:0 0 0 2px #4A211D}
.mk.t .lb{color:#E4A9A4;font-weight:700;font-size:9.5px}
.mk.hq .dot{width:11px;height:11px;background:none;border:2px solid var(--text);border-radius:2px;transform:rotate(45deg)}
.mk.hq .lb{color:var(--text);font-weight:600}
.mk.on .dot{background:var(--moss);box-shadow:0 0 0 1px #3E5B33}
.mlg{display:flex;gap:11px;font-size:10.5px;color:var(--dim2);margin:-6px 0 12px;flex-wrap:wrap}
.mlg i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:middle}

/* ── 원정 일지 ── */
.story{border-left:1px solid var(--line2);margin:10px 0 4px;padding-left:0}
.story .sl{display:flex;gap:10px;padding:5px 0 5px 11px;position:relative}
.story .sl::before{
  content:"";position:absolute;left:-3.5px;top:12px;width:6px;height:6px;
  border-radius:50%;background:var(--line2)
}
.story .sd{flex:none;width:38px;font-size:11px;color:var(--dim2);padding-top:1px}
.story .sx{flex:1;font-size:13px;line-height:1.5}

/* ── 그래프 ── */
.chart{
  background:var(--panel2);border:1px solid var(--line);
  border-radius:var(--r);padding:10px 10px 6px;margin:10px 0
}
.chart .ct{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--dim);margin-bottom:6px}
.chart .ct b{color:var(--text);font-size:13px}
.chart svg{display:block;width:100%;height:auto}
.spark{vertical-align:middle;margin-left:5px}

/* ── 위협 ── */
.threat{
  background:linear-gradient(180deg,#2E1A18,#241715);
  border:1px solid #6B322C;border-left:3px solid var(--blood);
  padding:12px 13px;margin-bottom:14px;border-radius:0 var(--r) var(--r) 0
}
.threat .th{display:flex;align-items:baseline;gap:8px}
.threat .tn{font-size:15px;font-weight:700;flex:1;color:#F0C7C2}
.threat .td{font-size:20px;font-weight:800;color:var(--blood);letter-spacing:-.02em}
.threat .tb{font-size:12.5px;color:#C79B96;margin-top:5px;line-height:1.5}
.threat .tw{
  font-size:11.5px;color:#E4A9A4;margin-top:7px;padding-top:7px;
  border-top:1px solid #4A2622
}
.threat.done{background:#1E2B1B;border-color:#3E5B33;border-left-color:var(--moss)}
.threat.done .tn{color:#BFE0AE}.threat.done .td{color:var(--moss)}.threat.done .tb{color:#93B383}
.quest.tq{
  border-color:#6B322C;border-left-color:var(--blood);
  background:linear-gradient(180deg,#291816,var(--panel))
}

/* ── 목표 패널 ── */
.goal{
  background:var(--panel);border:1px solid var(--line);
  padding:11px 13px;border-radius:var(--r);margin-bottom:14px
}
.goal .gh{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--dim)}
.goal .gh b{color:var(--brass);font-size:13px;font-weight:700}
.goal .gp{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:7px 0 5px}
.goal .gp i{display:block;height:100%;background:var(--brass)}
.goal .gu{font-size:11.5px;color:var(--dim2);line-height:1.5}

/* ── 월말 결산 ── */
.mrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.mrow .ml{color:var(--dim)}
.mrow .mv{font-weight:700}
.award{
  background:var(--panel2);border-left:2px solid var(--brass);
  padding:9px 11px;margin-bottom:6px;border-radius:0 var(--r) var(--r) 0
}
.award .al{font-size:11px;color:var(--brass);font-weight:700}
.award .an{font-size:14px;font-weight:700;margin-top:1px}
.award .ad{font-size:11.5px;color:var(--dim);margin-top:1px}

/* ── 태그 ── */
.tag{font-size:11px;padding:0 5px;border-radius:2px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap;line-height:1.6}
.tag.g{color:var(--moss);border-color:#3E5B33}
.tag.b{color:var(--blood);border-color:#5C302C}
.tag.y{color:var(--brass);border-color:var(--brass-d)}
.tag.a{color:var(--arc);border-color:#3F4A6B}

/* ── 모달 ── */
#mroot{position:fixed;inset:0;z-index:60;display:none;background:rgba(8,11,14,.72)}
#mroot.on{display:flex;align-items:flex-end;justify-content:center}
.modal{
  width:100%;max-width:520px;max-height:90vh;overflow-y:auto;background:var(--panel);
  border:1px solid var(--line2);border-bottom:0;border-radius:8px 8px 0 0;
  padding:16px 15px calc(16px + env(safe-area-inset-bottom));
  animation:up .18s ease-out
}
@keyframes up{from{transform:translateY(14px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
.modal h3{margin:0 0 3px;font-size:18px;font-weight:700;letter-spacing:-.02em}
.modal .sub{color:var(--dim);font-size:12.5px;margin-bottom:13px}
.mbtns{display:flex;gap:7px;margin-top:15px}
.mbtns button{
  flex:1;padding:11px;border-radius:var(--r);background:var(--panel2);
  border:1px solid var(--line2);font-weight:600;font-size:14px
}
.mbtns button.p{background:var(--brass);border-color:var(--brass);color:#181203;font-weight:700}
.mbtns button:disabled{opacity:.38}

/* ── 능력치 ── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:10px 0}
.st{font-size:12px}
.st .sl{display:flex;justify-content:space-between;color:var(--dim)}
.st .sl b{color:var(--text);font-weight:700;font-size:13px}
.st .bar i{background:var(--dim)}
.st.hi .bar i{background:var(--brass)}

/* ── 판정 리포트 ── */
.rep-l{
  display:flex;justify-content:space-between;gap:10px;font-size:12.5px;
  padding:4px 0;border-bottom:1px dotted var(--line)
}
.rep-l .lb{color:var(--dim);flex:1}
.rep-l .vl{font-weight:700;white-space:nowrap}
.rep-l.p .vl{color:var(--moss)}
.rep-l.n .vl{color:var(--blood)}
.rep-l.w{color:var(--blood)}
.rep-l.w .lb{color:var(--blood)}
.final{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:10px;padding-top:9px;border-top:1px solid var(--line2);font-weight:700
}
.final .big{font-size:22px}
.hint{
  background:var(--panel2);border-left:2px solid var(--line2);
  padding:8px 10px;font-size:12.5px;color:var(--dim);margin-top:9px;border-radius:0 var(--r) var(--r) 0
}
.hint b{color:var(--text)}

/* ── 체크 목록 ── */
.pick{
  display:flex;align-items:center;gap:9px;padding:9px 10px;margin-bottom:5px;
  background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);width:100%;text-align:left
}
.pick.on{border-color:var(--brass);background:#2A2A1C}
.pick.off{opacity:.42}
.pick .box{width:15px;height:15px;border:1px solid var(--line2);border-radius:2px;flex:none;position:relative}
.pick.on .box{background:var(--brass);border-color:var(--brass)}
.pick.on .box::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #181203;border-width:0 2px 2px 0;transform:rotate(42deg)}

/* ── 기타 ── */
.note{font-size:12px;color:var(--dim2);line-height:1.6}
.money{color:var(--brass);font-weight:700}
.neg{color:var(--blood);font-weight:700}
.pos{color:var(--moss);font-weight:700}
.empty{color:var(--dim2);font-size:13px;padding:18px 0;text-align:center}
.warn{
  background:#2B1E1C;border:1px solid #5C302C;color:#E4A9A4;
  padding:9px 11px;border-radius:var(--r);font-size:12.5px;margin-bottom:8px
}
.good{background:#1E2B1B;border:1px solid #3E5B33;color:#A9CE97}
.tiny{font-size:11px;color:var(--dim2)}
.up{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--line)
}
.up b{font-size:13.5px}
.up .lv{color:var(--brass);font-size:12px;font-weight:700}
.up button{
  background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);
  padding:6px 11px;font-size:12px;font-weight:600;white-space:nowrap
}
.up button:disabled{opacity:.35}
.seg{display:flex;gap:5px;margin-bottom:11px}
.seg button{
  flex:1;padding:7px 4px;font-size:12.5px;font-weight:600;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--line);color:var(--dim)
}
.seg button.on{background:var(--panel2);border-color:var(--brass);color:var(--brass)}

/* ── 탭바 ── */
#tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  max-width:520px;margin:0 auto;background:var(--panel);
  border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom)
}
#tabs button{flex:1;padding:8px 0 9px;text-align:center;color:var(--dim2);font-size:10.5px}
#tabs button .ti{display:block;font-size:19px;line-height:1.25;filter:grayscale(1) opacity(.62)}
#tabs button.on{color:var(--brass)}
#tabs button.on .ti{filter:none}
#tabs button .dot{
  position:absolute;margin-left:12px;margin-top:-2px;width:6px;height:6px;
  border-radius:50%;background:var(--blood)
}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="view"></main>
</div>
<nav id="tabs"></nav>
<div id="mroot"></div>

<script>
"use strict";
/* ══════════════════════════════════════════════════
   헌터 길드 매니저 — 프로토타입
   설계 원칙
   1. 방치 없음. 접속하지 않는 동안 시간은 흐르지 않는다.
   2. 의뢰에 소요일이 있다. 에이스는 동시에 두 곳에 못 간다.
   3. 정보는 불완전하다. 정찰로 산다.
   4. 실패에는 반드시 "왜"가 붙는다.
   5. 헌터는 거절하고, 떠나고, 은퇴한다.
   ══════════════════════════════════════════════════ */

/* ───────── 유틸 ───────── */
const $=s=>document.querySelector(s);
let SEED=(Date.now()^0x5f3759df)%2147483647;if(SEED<=0)SEED+=2147483646;
function rnd(){SEED=SEED*16807%2147483647;return (SEED-1)/2147483646;}
const ri=(a,b)=>Math.floor(rnd()*(b-a+1))+a;
const pick=a=>a[Math.floor(rnd()*a.length)];
const chance=p=>rnd()*100<p;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sgn=n=>(n>=0?'+':'')+Math.round(n);
// 받침 유무에 따라 조사를 고른다. "윤지호이(가)" 같은 표기를 없앤다.
function jong(w){
  if(!w)return false;
  const c=String(w).charCodeAt(String(w).length-1);
  if(c<0xAC00||c>0xD7A3)return false;
  return (c-0xAC00)%28!==0;
}
const ga=w=>w+(jong(w)?'이':'가');
const eul=w=>w+(jong(w)?'을':'를');
const neun=w=>w+(jong(w)?'은':'는');
const gwa=w=>w+(jong(w)?'과':'와');
function ro(w){
  const c=String(w).charCodeAt(String(w).length-1);
  if(c<0xAC00||c>0xD7A3)return w+'로';
  const j=(c-0xAC00)%28;
  return w+((j===0||j===8)?'로':'으로');
}
function stars(n,max){max=max||5;let h='';for(let i=1;i<=max;i++)h+=i<=n?'★':'<span class="u">★</span>';return '<span class="stars">'+h+'</span>';}

/* ───────── 헌터 관계 · 팀 숙련도 ───────── */
// 같은 조합을 계속 쓰면 호흡이 맞고, 사이 나쁜 둘을 붙이면 성공률이 떨어진다.
// "에이스를 묶어둘까, 경험을 나눠줄까"를 실제 의사결정으로 만드는 층.
function relKey(a,b){return a<b?a+'~'+b:b+'~'+a;}
function rel(a,b){return (G.rel&&G.rel[relKey(a,b)])||0;}
function addRel(a,b,v){
  if(a===b)return;
  G.rel=G.rel||{};const k=relKey(a,b);
  const cur=G.rel[k]||0;
  // 친해질수록 더 친해지기 어렵고, 틀어질수록 더 틀어지기 쉽다
  if(v>0)v*=Math.max(0.15,1-Math.max(0,cur)/130);
  else    v*=1+Math.max(0,-cur)/240;
  G.rel[k]=cl(cur+v,-100,100);
}
function relLabel(v){
  if(v>=70)return['둘도 없는 사이','var(--moss)'];
  if(v>=40)return['신뢰','var(--moss)'];
  if(v>=15)return['호의','#8FA0A8'];
  if(v<=-60)return['원수','var(--blood)'];
  if(v<=-35)return['불화','var(--blood)'];
  if(v<=-15)return['껄끄러움','#C79B96'];
  return['보통','var(--dim2)'];
}

const CLASH={'공격적':['소심함','신중함'],'오만함':['자유분방','성실함'],
             '소심함':['공격적','오만함'],'자유분방':['오만함','신중함'],
             '신중함':['공격적','자유분방'],'성실함':['오만함']};
function seedRel(h){
  G.hunters.forEach(o=>{
    if(o.id===h.id)return;
    let v=ri(-16,16);
    if((CLASH[h.pers]||[]).includes(o.pers))v-=ri(16,32);
    if(h.pers===o.pers)v+=ri(4,12);
    if(h.cls===o.cls)v+=ri(0,6);
    if(h.traits.includes('오만함')||o.traits.includes('고집'))v-=ri(0,8);
    addRel(h.id,o.id,v);
  });
}
function teamKey(ids){return ids.slice().sort((a,b)=>a-b).join('.');}
function teamOf(ids){return (G.teams&&G.teams[teamKey(ids)])||{n:0,last:0};}
function teamLv(n){return n>=15?3:n>=8?2:n>=3?1:0;}
const TEAMB=[0,3,5,7];
function bumpTeam(ids,d){
  if(ids.length<2)return;
  G.teams=G.teams||{};
  const k=teamKey(ids), t=G.teams[k]||{n:0,last:0};
  t.n=cl(t.n+d,0,40); t.last=G.day;
  G.teams[k]=t;
}
// 파티의 관계·숙련도 요약
function partySync(party){
  if(party.length<2)return null;
  let sum=0,pairs=0,worst=null,best=null;
  for(let i=0;i<party.length;i++)for(let j=i+1;j<party.length;j++){
    const v=rel(party[i].id,party[j].id);
    sum+=v;pairs++;
    if(!worst||v<worst.v)worst={v,a:party[i],b:party[j]};
    if(!best||v>best.v)best={v,a:party[i],b:party[j]};
  }
  const t=teamOf(party.map(h=>h.id));
  return {avg:sum/pairs,worst,best,team:t,lv:teamLv(t.n)};
}

function hrng(seed){
  let x=(seed>>>0)||1;
  return ()=>{x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;return x/4294967296;};
}
const TINCT=['#8C332C','#2F5680','#3F6438','#7C6320','#4B3C6E','#6A452C','#2C6560','#692F55','#5A5F6B','#7A3A22'];
const CHARGE=['star','crescent','sword','eye','rose','tower','fang','flame','drop','bolt'];
function chargePath(c){

    case 'star':    return '<path d="M16 8.5l2.3 4.9 5.2.7-3.8 3.6 1 5.2-4.7-2.5-4.7 2.5 1-5.2-3.8-3.6 5.2-.7z"/>';
    case 'crescent':return '<path d="M21.5 9a8 8 0 100 13 9.6 9.6 0 010-13z"/>';
    case 'sword':   return '<path d="M15 7h2v13h-2z"/><path d="M11 19h10v2H11z"/><path d="M15 21h2v4h-2z"/>';
    case 'eye':     return '<path d="M6 16c4-5.5 16-5.5 20 0-4 5.5-16 5.5-20 0z" fill="none" stroke-width="2"/><circle cx="16" cy="16" r="3"/>';
    case 'rose':    return '<circle cx="16" cy="16" r="3.2"/><path d="M16 7c3 3 3 5 0 6s-3-3 0-6zM25 16c-3 3-5 3-6 0s3-3 6 0zM16 25c-3-3-3-5 0-6s3 3 0 6zM7 16c3-3 5-3 6 0s-3 3-6 0z"/>';
    case 'tower':   return '<path d="M11 24V12h2v-2h2v2h2v-2h2v2h2v12z"/><path d="M14 18h4v6h-4z" fill="#0006"/>';
    case 'fang':    return '<path d="M9 8h14l-3 8-4 9-4-9z"/>';
    case 'flame':   return '<path d="M16 6c4 5 7 7 7 12a7 7 0 11-14 0c0-3 2-4 3-7 1 3 2 4 3 2 1-2 0-4 1-7z"/>';
    case 'drop':    return '<path d="M16 6c4 6 7 8 7 12a7 7 0 11-14 0c0-4 3-6 7-12z"/>';
    default:        return '<path d="M18 6l-8 12h5l-2 8 9-13h-5z"/>';
  }
}
function sigil(h,sz){
  sz=sz||30;
  const r=hrng(h.id*7919+2654);
  const a=TINCT[Math.floor(r()*TINCT.length)];
  let b=TINCT[Math.floor(r()*TINCT.length)]; if(b===a)b=TINCT[(TINCT.indexOf(a)+3)%TINCT.length];
  const div=Math.floor(r()*4);
  const ch=CHARGE[Math.floor(r()*CHARGE.length)];
  const col=gradeOf(h)[1];
  const uid='sg'+h.id;
  let field;
  if(div===0)      field=`<rect x="0" y="0" width="16" height="36" fill="${a}"/><rect x="16" y="0" width="16" height="36" fill="${b}"/>`;
  else if(div===1) field=`<rect x="0" y="0" width="32" height="17" fill="${a}"/><rect x="0" y="17" width="32" height="19" fill="${b}"/>`;
  else if(div===2) field=`<rect width="32" height="36" fill="${a}"/><path d="M0 36L32 0v36z" fill="${b}"/>`;
  else             field=`<rect width="32" height="36" fill="${a}"/>`;
  const dim=h.injury?'<rect width="32" height="36" fill="#0B0E11" opacity=".45"/>':'';
  return `<svg class="sig" width="${sz}" height="${Math.round(sz*1.125)}" viewBox="-1 -1 34 38" aria-hidden="true">
    <defs><clipPath id="${uid}"><path d="M1 1h30v17c0 11-8 15-15 17C9 33 1 29 1 18z"/></clipPath></defs>
    <g clip-path="url(#${uid})">${field}${dim}
      <g fill="#EDE7DA" fill-opacity=".92" stroke="#EDE7DA" stroke-opacity=".92">${chargePath(ch)}</g></g>
    <path d="M1 1h30v17c0 11-8 15-15 17C9 33 1 29 1 18z" fill="none" stroke="${col}" stroke-width="2"/>
  </svg>`;
}

/* ───────── 성장 그래프 ───────── */
function sparkline(pts,w,h,col,fill){
  if(!pts||pts.length<2)return '';
  const xs=pts.map(p=>p.d),ys=pts.map(p=>p.p);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const dx=(x1-x0)||1, dy=(y1-y0)||1;
  const P=pts.map(p=>[( (p.d-x0)/dx*(w-2)+1 ).toFixed(1),( h-2-(p.p-y0)/dy*(h-4) ).toFixed(1)]);
  const line=P.map((c,i)=>(i?'L':'M')+c[0]+' '+c[1]).join(' ');
  const area=fill?`<path d="${line} L${P[P.length-1][0]} ${h} L${P[0][0]} ${h} Z" fill="${col}" opacity=".13"/>`:'';
  const last=P[P.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px">
    ${area}<path d="${line}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.2" fill="${col}"/></svg>`;
}
function growthChart(h){
  const pts=(h.hist||[]).slice(-40);
  if(pts.length<2)return `<div class="chart"><div class="ct"><span>전투력 추이</span><b>${power(h)}</b></div>
    <div class="empty" style="padding:12px 0">기록이 쌓이면 성장 곡선이 나타납니다.</div></div>`;
  const lo=Math.min(...pts.map(p=>p.p)),hi=Math.max(...pts.map(p=>p.p));
  const span=pts[pts.length-1].d-pts[0].d;
  return `<div class="chart">
    <div class="ct"><span>전투력 추이 · 최근 ${span}일</span><b>${power(h)} <span class="pos" style="font-size:11px">${sgn(hi-lo>0?pts[pts.length-1].p-pts[0].p:0)}</span></b></div>
    ${sparkline(pts,240,54,'#C9A227',1)}
    <div class="ct" style="margin:2px 0 0"><span>${pts[0].d}일차 · ${lo}</span><span>최고 ${hi}</span></div></div>`;
}

/* ───────── 헌터 생성 ───────── */
function mkHunter(o){
  o=o||{};
  const cls=o.cls||pick(Object.keys(CLASSES));
  const w=CLASSES[cls].w;
  const pot=o.pot||cl(Math.round(38+rnd()*rnd()*62+ri(-4,8)),30,97);
  const lv=o.lv||1;
  const base=18+Math.round(pot*0.16)+lv*1.1;
  const st={},caps={};
  SKEYS.forEach(k=>{
    caps[k]=cl(Math.round(pot*(0.52+0.30*w[k]))+ri(-6,8),14,99);
    st[k]=cl(Math.round(base*(0.55+0.55*w[k])+ri(-4,5)),8,caps[k]);
  });
  for(let i=1;i<lv;i++) grow({stats:st,caps,pot,cls},true);

  const traits=(o.traits||[]).slice();
  const tp=Object.keys(TRAITS).filter(t=>TRAITS[t].g===1);
  const tn=Object.keys(TRAITS).filter(t=>TRAITS[t].g===0);
  const target=Math.min(3,ri(1,2)+(o.traits?o.traits.length:0));
  let guard=0;
  while(traits.length<target && guard++<40){
    const t=chance(pot>78?72:56)?pick(tp):pick(tn);
    if(!traits.includes(t))traits.push(t);
  }
  const name=o.name||(chance(72)?pick(SUR)+pick(GIV):pick(FANT));
  const pw0=Math.round(st.atk*.36+st.def*.24+st.hp*.20+st.agi*.20);
  return {
    id:G?G.nextId++:0, name, cls, lv, xp:0, age:o.age||ri(17,31),
    stats:st, caps, pot, traits, pers:o.pers||pick(Object.keys(PERSONA)),
    fatigue:0, injury:null, busy:null, until:0,
    equip:{무기:null,방어구:null,장신구:null},
    loyalty:o.loyalty!=null?o.loyalty:ri(55,78),
    contract:o.contract||ri(80,220),
    salary:Math.round((40+pw0*2.4+pw0*pw0/90)*(traits.includes('탐욕')?1.45:1)),
    offer:null, quests:0, wins:0, retiring:false, hist:[],
  };
}
function grow(h,silent){
  const w=CLASSES[h.cls].w;
  let pts=2+Math.round(h.pot/32);
  const gained={};
  let guard=0;
  while(pts>0 && guard++<80){
    const k=weightedStat(w);
    if(h.stats[k]<h.caps[k]){h.stats[k]++;gained[k]=(gained[k]||0)+1;pts--;}
    else if(SKEYS.every(x=>h.stats[x]>=h.caps[x]))break;
  }
  return gained;
}
function weightedStat(w){
  let t=0;SKEYS.forEach(k=>t+=w[k]);
  let r=rnd()*t;
  for(const k of SKEYS){r-=w[k];if(r<=0)return k;}
  return 'atk';
}

/* ───────── 파생 수치 ───────── */
function eff(h,k){
  let v=h.stats[k];
  for(const s in h.equip){const it=h.equip[s];if(it&&ITEMS[it].s===k)v+=ITEMS[it].v;}
  if(k==='luk'&&h.traits.includes('행운아'))v+=12;
  if(h.injury)v=Math.round(v*(1-INJ[h.injury.t].pen));
  return Math.round(v);
}
function power(h){
  const off=Math.max(eff(h,'atk'),eff(h,'mag')*0.95);
  return Math.round(off*.36+eff(h,'def')*.24+eff(h,'hp')*.20+eff(h,'agi')*.20);
}
function gradeOf(h){
  const s=power(h)*0.62+h.pot*0.75;
  if(s>=160)return['A','#C0504A'];if(s>=128)return['B','#C9A227'];
  if(s>=100)return['C','#A87BC9'];if(s>=76)return['D','#7B8FCB'];
  if(s>=54)return['E','#6F9E5A'];return['F','#8DA0A9'];
}
function xpNeed(lv){return 50+lv*lv*4;}
function potShown(h){
  const e=FAC.scout.v[G.fac.scout-1];
  if(e===0)return '잠재력 '+h.pot;
  const lo=cl(h.pot-e,10,99),hi=cl(h.pot+e,10,99);
  if(e>=22)return '잠재력 '+stars(cl(Math.round(h.pot/20),1,5));
  return '잠재력 '+lo+'~'+hi;
}
function guildPts(){
  let r=0;for(const k in G.rep)r+=G.rep[k];
  return Math.round(r*1.4+(G.donePts||0)+G.earned/14000);
}
function guildGrade(){
  let g='F';for(const[n,t] of GRADES)if(guildPts()>=t)g=n;return g;
}
function maxParty(){return ['C','B','A','S'].includes(guildGrade())?4:3;}
function maxHunters(){return FAC.dorm.v[G.fac.dorm-1];}

}

function newMonth(){
  return {income:0,expense:0,quests:0,fails:0,contrib:{},newbies:[],
          rep:{combat:0,guard:0,explore:0,arcane:0},pts:0,rank:0,threats:0,threatWin:0,hard:0,h3:0,h4:0};

// 위협은 길드 점수가 아니라 "지금 우리 최정예 파티"를 기준으로 만든다.
// 그래야 항상 A팀을 꺼내야 하는 싸움이 되고, 손도 못 대는 벽이 되지 않는다.
function bestParty(){
  const n=maxParty();
  const l=G.hunters.map(power).sort((a,b)=>b-a).slice(0,n);
  return {sum:l.reduce((a,b)=>a+b,0)||60,n:l.length||1};
}
function bestStat(k){
  const n=maxParty();
  if(k==='mag')return Math.max(45,...G.hunters.map(h=>eff(h,'mag')));
  const l=G.hunters.map(h=>eff(h,k)).sort((a,b)=>b-a).slice(0,n);
  return l.length?l.reduce((a,b)=>a+b,0)/l.length:45;
}
function spawnThreat(){
  const T=pick(THREATS);
  const pl=pick(PLACE), mb=pick(MOB);
  const bp=bestParty();
  const reqPow=Math.round(bp.sum*(0.82+rnd()*0.24));   // 정예 파티의 82~106%
  const LAD=[42,92,160,245,345];
  let d=2; LAD.forEach((v,i)=>{ if(reqPow>=v*0.9)d=Math.max(2,i+1); });
  const lead=ri(7,12);                       // 예고 후 발생까지
  const req={};
  QT[T.t].st.forEach((k,i)=>{ req[k]=Math.round(bestStat(k)*(i?0.88:1.0)); });
  const days=cl([1,2,2,3,4][d-1],1,4);
  const reward=Math.round(reqPow*(11+d*3.2)*2.4/10)*10;
  const q={
    id:G.nextId++, name:`${T.n} — ${pl}`, type:T.t, d, reqPow, req, days, reward,
    place:pl, mob:mb, npc:pick(NPCN), herb:pick(HERB),
    hz:[], scouted:true, deadline:G.day+lead,
    off:0, offRoll:100, threat:true,
  };
  G.quests.unshift(q);
  G.threat={
    qid:q.id, name:T.n, ic:T.ic, place:pl, day:G.day+lead, rep:T.rep,
    desc:T.d(pl,mb), fail:T.fail, d, done:false, reward,
    penGold:cl(0.12+d*0.03,0.12,0.28), penRep:8+d*3,
  };
  G.mo.threats++;
  push(`${T.ic} 위기 예고 — ${T.n} (${lead}일 뒤)`,'bad');
  G.queue.push({type:'threat'});
}
function fireThreat(){
  const t=G.threat; if(!t||t.done)return;
  const loss=Math.round(G.gold*t.penGold);
  G.gold=Math.max(0,G.gold-loss);
  G.rep[t.rep]=cl(G.rep[t.rep]-t.penRep,0,100);
  G.hunters.forEach(h=>h.loyalty=cl(h.loyalty-5,0,100));
  const rv=pick(G.rivals); rv.p=Math.round(rv.p*1.05);
  G.quests=G.quests.filter(q=>q.id!==t.qid);
  G.active=(G.active||[]).filter(q=>{
    if(q.id!==t.qid)return true;
    q.sent.ids.forEach(id=>{const h=G.hunters.find(x=>x.id===id);if(h){h.busy=null;h.party=null;}});
    return false;
  });
  t.done=true; t.failed=true; t.loss=loss; t.rival=rv.n; G.thFail=(G.thFail||0)+1;
  push(`${t.ic} ${t.name} 대응 실패 — 배상금 ${fmt(loss)}G, ${REPN[t.rep]} -${t.penRep}`,'bad');
  G.queue.push({type:'threatFail'});
}

function rollGoal(prev){
  const gp=guildPts();
  if(prev){
    G.avgQ=G.avgQ?G.avgQ*0.6+(prev.quests-prev.fails)*0.4:(prev.quests-prev.fails);
    G.avgH=G.avgH!=null?G.avgH*0.6+(prev.h3||0)*0.4:(prev.h3||0);
  }
  const pq=G.avgQ||6, p3=G.avgH!=null?G.avgH:2;
  const kinds=[
    ()=>{const n=cl(Math.round(pq*0.95)+1,5,40);
      return {k:'quests',t:n,c:0,txt:`의뢰 ${n}건 성공`,rw:Math.round(700+gp*2.4)};},
    ()=>{const k=pick(Object.keys(REPN));
      const up=Math.max(3,Math.round((100-G.rep[k])*0.08)+ri(0,2));   // 실측: 한 달에 명성 +6~8이 현실
      const n=Math.round(cl(G.rep[k]+up,10,100));
      return {k:'rep',sub:k,t:n,c:Math.round(G.rep[k]),txt:`${REPN[k]} ${n} 달성`,rw:Math.round(900+gp*2.8)};},
    ()=>{const m=G.hunters.length?Math.max(...G.hunters.map(power)):40;const n=m+ri(1,3);
      return {k:'power',t:n,c:0,txt:`전투력 ${n} 헌터 보유`,rw:Math.round(1000+gp*2.6)};},
    ()=>{const min=gp>1800?4:3;
      const n=cl(Math.round(p3*(min>=4?0.45:0.8))+1,2,14);
      return {k:'hard',t:n,c:0,min,txt:`★${min} 이상 의뢰 ${n}건 성공`,rw:Math.round(1200+gp*3.2)};},
  ];
  G.goal=pick(kinds)();
  G.goal.done=false;
}
function goalProgress(){
  const g=G.goal; if(!g)return 0;
  if(g.k==='rep')return cl(Math.round(G.rep[g.sub])/g.t,0,1);
  if(g.k==='power'){const m=G.hunters.length?Math.max(...G.hunters.map(power)):0;return cl(m/g.t,0,1);}
  return cl(g.c/g.t,0,1);
}
function checkGoal(){
  const g=G.goal; if(!g||g.done)return;
  if(goalProgress()>=1){
    g.done=true; G.gold+=g.rw; G.mo.income+=g.rw; G.goalWin=(G.goalWin||0)+1;
    G.donePts=(G.donePts||0)+12;
    push(`🎯 이달의 과제 달성 — ${g.txt} (보상 ${fmt(g.rw)}G)`,'good');
  }
}

/* ───────── 의뢰 생성 ───────── */
function mkQuest(){
  const gp=guildPts();
  const rw={combat:G.rep.combat,guard:G.rep.guard,explore:G.rep.explore,arcane:G.rep.arcane};
  const types=Object.keys(QT);
  const type=pick(types.filter(t=>rnd()<0.35+rw[QT[t].rep]/140).concat(types));
  const tier=cl(Math.round(gp/180),0,4);
  const d=cl(ri(1,2)+ri(0,tier)+(chance(18)?1:0),1,5);
  const REQ=[42,92,160,245,345];
  const reqPow=Math.round(REQ[d-1]*(0.86+rnd()*0.3));
  const req={};
  QT[type].st.forEach((k,i)=>{
    req[k]=Math.round((36+d*10)*(i?0.88:1)*(0.9+rnd()*0.24));
  });
  const days=[1,2,2,3,4][d-1]+(chance(30)?1:0);
  const repM=1+(rw[QT[type].rep]||0)/210;
  const reward=Math.round(reqPow*(11+d*3.2)*(0.9+rnd()*0.25)*repM/10)*10;
  const hz=[];
  const hn=chance(30+d*8)?(chance(22)?2:1):0;
  for(let i=0;i<hn;i++){const h=pick(HAZ);if(!hz.includes(h))hz.push(h);}
  const place=pick(PLACE), mob=pick(MOB), npc=pick(NPCN), herb=pick(HERB);
  let name;
  if(type==='토벌')name=place+' '+mob+' 토벌';
  else if(type==='호위')name=npc+' 호위';
  else if(type==='구조')name=place+' 실종자 수색';
  else if(type==='탐색')name=place+' 탐색';
  else if(type==='채집')name=herb+' 채집';
  else name=place+' '+mob+' 흔적 조사';
  return {
    id:G.nextId++, name, type, d, reqPow, req, days, reward,
    place, mob, npc, herb,
    hz, scouted:false, deadline:G.day+days+ri(3,8),
    off:chance(50)?1:-1, offRoll:rnd()*100,   // 추정 난이도는 고정. 정찰단을 올리면 정확해진다
  };
}
function shownDiff(q){
  if(q.scouted)return q.d;
  const e=FAC.scout.v[G.fac.scout-1];
  if(e===0||q.offRoll>=e*1.9)return q.d;
  return cl(q.d+q.off,1,5);
}
function scoutCost(q){
  return Math.round(q.reward*(0.13-G.fac.scout*0.012)/10)*10;
}

/* ───────── 판정 ───────── */
/* reveal=false : 플레이어가 아는 정보만 (정찰 안 했으면 위험 요소 미반영)
   reveal=true  : 실제 판정 */
function evaluate(q,party,reveal){
  const L=[];
  const useHz=(reveal||q.scouted)?q.hz:[];
  let powMul=1,flat=0,extraReq={},injAdd=0,rewMul=1,dayAdd=0;
  if(reveal&&q.mods&&q.mods.label){
    flat+=q.mods.flat; dayAdd+=q.mods.days; injAdd+=q.mods.inj; rewMul*=q.mods.rew;
  }
  useHz.forEach(h=>{
    if(h.pow)powMul*=h.pow;
    if(h.flat)flat+=h.flat;
    if(h.add)extraReq[h.add[0]]=Math.max(extraReq[h.add[0]]||0,h.add[1]);
    if(h.inj)injAdd+=h.inj;
    if(h.rew)rewMul*=h.rew;
    if(h.days)dayAdd+=h.days;
  });
  const reqPow=Math.round(q.reqPow*powMul);
  const reqs=Object.assign({},q.req);
  for(const k in extraReq)reqs[k]=Math.max(reqs[k]||0,extraReq[k]);

  let p=55;
  const pp=party.reduce((a,h)=>a+power(h),0);
  const pd=cl((pp/reqPow-1)*55,-40,33);
  p+=pd;
  L.push({l:`파티 전투력 ${pp} vs 요구 ${reqPow}`,v:sgn(pd),k:pd>=0?'p':'n'});

  for(const k in reqs){
    const need=reqs[k];
    const mine=k==='mag'
      ? Math.max(...party.map(h=>eff(h,'mag')))
      : Math.round(party.reduce((a,h)=>a+eff(h,k),0)/party.length);
    const dv=cl((mine/need-1)*36,-17,15);
    p+=dv;
    const isExtra=extraReq[k]!=null&&(q.req[k]==null||q.req[k]<extraReq[k]);
    L.push({l:`${STATN[k]} ${k==='mag'?'최고':'평균'} ${mine} vs 요구 ${need}${isExtra?' (위험요소)':''}`,v:sgn(dv),k:dv>=0?'p':'n'});
  }
  // 특성
  party.forEach(h=>{
    if(h.traits.includes('전투광')&&q.type==='토벌'){p+=8;L.push({l:`🔥 전투광 (${h.name})`,v:'+8',k:'p'});}
    if(h.traits.includes('해결사')&&['탐색','조사','채집'].includes(q.type)){p+=10;L.push({l:`🧭 해결사 (${h.name})`,v:'+10',k:'p'});}
    if(h.traits.includes('겁쟁이')&&q.d>=4){p-=14;L.push({l:`😨 겁쟁이 (${h.name}) 강적 대치`,v:'-14',k:'n'});}
    if(h.traits.includes('고집')&&party.length>1){p-=7;L.push({l:`😤 고집 (${h.name})`,v:'-7',k:'n'});}
    if(h.traits.includes('카리스마')&&party.length>1){p+=6;L.push({l:`🗣️ 카리스마 (${h.name})`,v:'+6',k:'p'});}
  });
  // 파티 조합
  if(party.length>1){
    const lines=new Set(party.map(h=>CLASSES[h.cls].line));
    if(lines.size>=2){p+=6;L.push({l:'전위·후위 균형 편성',v:'+6',k:'p'});}
    const sy=partySync(party);
    if(sy){
      if(Math.abs(sy.avg)>=14){
        const rb=cl(sy.avg*0.10,-10,9);
        p+=rb;
        L.push({l:sy.avg>0?`팀 신뢰 (평균 ${Math.round(sy.avg)})`
                          :`팀 내 불화 (${sy.worst.a.name}↔${sy.worst.b.name} ${Math.round(sy.worst.v)})`,
                v:sgn(rb),k:rb>=0?'p':'n'});
      }
      if(sy.lv){
        p+=TEAMB[sy.lv];
        L.push({l:`합동 숙련도 Lv.${sy.lv} (${sy.team.n}회 동행)`,v:sgn(TEAMB[sy.lv]),k:'p'});
      }
    }
  }
  // 성격
  party.forEach(h=>{
    const P=PERSONA[h.pers];
    if(P.like.includes(q.type)){p+=3;L.push({l:`${h.name} 성격 적합 (${h.pers})`,v:'+3',k:'p'});}
    else if(P.dis.includes(q.type)){p-=4;L.push({l:`${h.name} 성격 부적합 (${h.pers})`,v:'-4',k:'n'});}
  });
  // 피로 / 부상
  const fa=party.reduce((a,h)=>a+h.fatigue,0)/party.length;
  if(fa>12){const v=-fa*0.26;p+=v;L.push({l:`평균 피로도 ${Math.round(fa)}%`,v:sgn(v),k:'n'});}
  party.forEach(h=>{if(h.injury){p-=9;L.push({l:`${h.name} ${INJ[h.injury.t].n} 상태 출전`,v:'-9',k:'n'});}});
  // 위험 요소 플랫
  useHz.forEach(h=>{
    if(h.flat){p+=h.flat;L.push({l:`${h.bad?'⚠️':'✅'} ${h.n}`,v:sgn(h.flat),k:h.flat>=0?'p':'n'});}
    else if(h.pow){L.push({l:`${h.bad?'⚠️':'✅'} ${h.n} (요구 전투력 ×${h.pow})`,v:'반영됨',k:h.bad?'n':'p'});}
    else if(h.rew){L.push({l:`✅ ${h.n} (보상 ×${h.rew})`,v:'반영됨',k:'p'});}
  });
  if(reveal&&q.mods&&q.mods.label){
    const bits=[];
    if(q.mods.days)bits.push('소요일 '+sgn(q.mods.days));
    if(q.mods.inj)bits.push('부상 '+sgn(q.mods.inj)+'%');
    if(q.mods.rew!==1)bits.push('보상 ×'+q.mods.rew);
    L.push({l:`현장 판단: ${q.mods.label}${bits.length?' ('+bits.join(', ')+')':''}`,
            v:q.mods.flat?sgn(q.mods.flat):'반영됨',k:q.mods.flat>=0?'p':'n'});
  }
  if(!q.scouted&&!reveal){
    L.push({l:'정찰 미실시 — 알려지지 않은 변수 존재',v:'?',k:'w'});
  }
  let days=q.days+dayAdd;
  if(party.some(h=>h.traits.includes('속공')))days=Math.max(1,days-1);
  const _sy=partySync(party);
  if(_sy&&_sy.lv>=3)days=Math.max(1,days-1);
  return {p:cl(Math.round(p),3,96), L, reqPow, reqs, injAdd, rewMul, days, unknown:!q.scouted&&q.hz.length>0};
}

/* ───────── 거절 판정 ───────── */
function refusal(h,q){
  const sd=shownDiff(q);
  if(h.traits.includes('겁쟁이')&&sd>=4)
    return {r:'😨 "저건... 저는 못 갑니다." (겁쟁이 · ★4 이상 거부)'};
  if(h.traits.includes('탐욕')){
    const perDay=q.reward/Math.max(1,q.days);
    const need=h.salary*0.55;
    if(perDay<need){
      const bribe=Math.round((need-perDay)*q.days/10)*10+50;
      return {r:'💰 "일당이 이거밖에 안 됩니까?" (탐욕 · 하루 '+fmt(perDay)+'G)',bribe};
    }
  }
  if(h.pers==='오만함'&&h.loyalty<75){
    const tier={'F':1,'E':1,'D':2,'C':3,'B':4,'A':5}[gradeOf(h)[0]];
    if(sd<=tier-2)
      return {r:'😐 "제 격에 맞는 일을 주십시오." (오만함)'};
  }
  if(h.loyalty<25&&chance(45))
    return {r:'😞 "길드장님 지시는 이제 안 따르겠습니다." (충성도 '+h.loyalty+')'};
  if(h.fatigue>=88)
    return {r:'😵 "더는 못 움직입니다." (피로도 '+Math.round(h.fatigue)+'%)'};
  if(PERSONA[h.pers].dis.includes(q.type)&&h.loyalty<38&&chance(35))
    return {r:`🙄 "${q.type} 같은 건 사양합니다." (${h.pers} · 낮은 충성도)`};
  return null;
}

/* ───────── 파견 ───────── */
function dispatch(q,party,bribe){
  const ev=evaluate(q,party,false);
  party.forEach(h=>{
    h.busy={type:'quest',qid:q.id};
    h.until=G.day+ev.days;
    h.party=party.map(x=>x.id);
  });
  q.sent={ids:party.map(h=>h.id),start:G.day,end:G.day+ev.days,est:ev.p,bribe:bribe||0};
  q.mods={flat:0,days:0,inj:0,rew:1,label:null,story:null};
  if(ev.days>=2&&chance(66)){    // 하루짜리 심부름엔 현장 판단이 없다
    const pool=FIELD.filter(f=>!f.party||party.length>=f.party);
    if(pool.length)q.field={fid:FIELD.indexOf(pick(pool)),
      day:G.day+cl(Math.floor(ev.days/2),1,ev.days-1),done:false};
  }
  if(bribe)G.gold-=bribe;
  G.quests=G.quests.filter(x=>x.id!==q.id);
  G.active=G.active||[];
  G.active.push(q);
  push(`${party.map(h=>h.name).join(', ')} → ${q.name} (${ev.days}일)`,'info');
}

/* ───────── 길드 추이 ───────── */
function trendChart(key,label,col,inv){
  const H=(G.hist||[]).filter(x=>x[key]!=null);
  if(H.length<2)return '';
  const pts=H.map(x=>({d:x.m,p:inv?-x[key]:x[key]}));
  const first=H[0][key],last=H[H.length-1][key];
  const df=last-first, up=inv?df<0:df>0;
  return `<div class="chart">
    <div class="ct"><span>${label} · ${H.length}개월</span>
      <b>${key==='gold'?fmt(last)+'G':key==='rank'?last+'위':fmt(last)}
      <span class="${df===0?'tiny':up?'pos':'neg'}" style="font-size:11px">${df===0?'—':(inv?(df<0?'↑'+(-df):'↓'+df):sgn(df))}</span></b></div>
    ${sparkline(pts,240,46,col,1)}</div>`;
}

/* ───────── 원정 일지 ───────── */
// 시뮬레이션 결과에서 서사를 뽑아낸다. 랜덤 장식이 아니라
// 실제 판정에 쓰인 수치·특성·위험요소가 그대로 문장이 된다.
function makeStory(q,party,ev,res,inj){
  const S=[];
  const add=(d,t,k)=>S.push({d,t,k:k||'info'});
  const D=ev.days;
  const P=party.slice().sort((a,b)=>power(b)-power(a));
  const lead=P[0];
  const tgt=q.type==='호위'?q.npc:(q.type==='채집'?q.herb:q.mob);
  const spot=q.place||'현장';
  const best=k=>P.slice().sort((a,b)=>eff(b,k)-eff(a,k))[0];
  const has=t=>P.find(h=>h.traits.includes(t));

  // 1일차 — 출발
  add(1,party.length>1?`${lead.name} 외 ${party.length-1}명이 ${ro(spot)} 출발했습니다.`
                      :`${ga(lead.name)} 단독으로 ${ro(spot)} 출발했습니다.`);
  if(!q.scouted)add(1,'사전 정찰 없이 들어갔습니다. 지형도 적의 수도 몰랐습니다.','bad');
  else if(!q.hz.length)add(1,'정찰 보고대로였습니다. 예상 밖의 변수는 없었습니다.','good');

  // 접근 — 능력치가 문장이 된다
  const fast=best('agi'), lucky=best('luk');
  if(D>=2){
    if(eff(fast,'agi')>=55)add(2,`${ga(fast.name)} 앞서 나가 길을 텄습니다.`,'good');
    else add(2,'행군이 더뎠습니다. 예정보다 늦게 도착했습니다.');
    if(has('행운아')&&chance(60))add(2,`${ga(has('행운아').name)} 순찰을 피할 샛길을 찾아냈습니다.`,'good');
  }

  // 위험 요소 발현
  let dd=Math.min(D,2);
  q.hz.forEach(z=>{ add(dd,z.s||z.d,z.bad?'bad':'good'); dd=Math.min(Math.max(1,D-1),dd+1); });

  // 현장 판단
  if(q.mods&&q.mods.story)add(Math.max(1,Math.min(D,Math.ceil(D/2))),q.mods.story,q.mods.good?'good':'info');
  // 능력치 미달 지점
  const weak=Object.keys(ev.reqs).map(k=>{
    const mine=k==='mag'?Math.max(...P.map(h=>eff(h,'mag')))
                        :Math.round(P.reduce((a,h)=>a+eff(h,k),0)/P.length);
    return {k,r:mine/ev.reqs[k],mine};
  }).sort((a,b)=>a.r-b.r)[0];
  if(weak&&weak.r<0.92){
    const W={atk:'공격이 통하지 않았습니다.',def:'방어선이 자꾸 뚫렸습니다.',
             hp:'체력이 먼저 바닥났습니다.',agi:'움직임을 따라가지 못했습니다.',
             mag:'마법에 대응할 수단이 없었습니다.',luk:'하는 일마다 어긋났습니다.'};
    add(Math.max(1,D-1),W[weak.k],'bad');
  } else if(weak&&weak.r>1.35){
    add(Math.max(1,D-1),'전력 차이가 분명했습니다. 상대가 되지 않았습니다.','good');
  }

  // 결전
  const V={
    '토벌':{win:n=>`${tgt} ${n}마리를 처치했습니다.`,lose:'포위당해 물러났습니다.',half:n=>`${n}마리를 처치했지만 우두머리는 놓쳤습니다.`},
    '호위':{win:()=>`${eul(tgt)} 무사히 목적지까지 인도했습니다.`,lose:'행렬이 흩어졌습니다.',half:()=>'짐 일부를 잃었지만 사람은 지켰습니다.'},
    '구조':{win:n=>`실종자 ${n}명을 찾아 데려왔습니다.`,lose:'끝내 찾지 못했습니다.',half:n=>`${n}명을 구했지만 전부는 아니었습니다.`},
    '탐색':{win:()=>`${spot} 전역을 지도에 기록했습니다.`,lose:'길을 잃고 되돌아왔습니다.',half:()=>'절반쯤 돌아보고 철수했습니다.'},
    '채집':{win:n=>`${tgt} ${n}개를 확보했습니다.`,lose:'쓸 만한 것을 찾지 못했습니다.',half:n=>`${n}개밖에 구하지 못했습니다.`},
    '조사':{win:()=>`${tgt}의 흔적을 추적해 근원을 밝혀냈습니다.`,lose:'단서가 끊겼습니다.',half:()=>'단서 일부만 확보했습니다.'},
  }[q.type]||{win:()=>'의뢰를 완수했습니다.',lose:'실패했습니다.',half:()=>'일부만 달성했습니다.'};
  const n=Math.round(q.d*q.d*ri(3,7)+ri(2,9));
  if(res==='대성공'){
    add(D,`${ga(lead.name)} 선두에서 밀어붙였습니다. ${V.win(n)}`,'good');
    add(D,'예상보다 훨씬 깔끔했습니다.','good');
  } else if(res==='성공'){
    add(D,V.win(Math.round(n*0.8)),'good');
  } else if(res==='절반 성공'){
    add(D,V.half(Math.round(n*0.4)),'bad');
  } else {
    if(has('불굴'))add(D,`${ga(has('불굴').name)} 퇴로를 열었습니다. 전멸은 면했습니다.`,'bad');
    add(D,V.lose,'bad');
  }
  // 부상
  inj.forEach(i=>add(D,`${ga(i.h.name)} ${eul(INJ[i.t].n)} 입었습니다. ${i.d}일간 이탈합니다.`,'bad'));
  // 귀환
  add(D,res==='실패'?'길드로 돌아왔습니다. 보고할 성과가 없습니다.'
                    :'길드로 돌아왔습니다.',res==='실패'?'bad':'info');
  S.sort((a,b)=>a.d-b.d);     // 일차 순서대로 정렬
  return S;
}
function storyHTML(S){
  if(!S||!S.length)return '';
  let h='<div class="story">',last=null;
  S.forEach(l=>{
    const nd=l.d!==last; last=l.d;
    const c=l.k==='good'?'var(--moss)':l.k==='bad'?'var(--blood)':'var(--dim)';
    h+=`<div class="sl"><span class="sd">${nd?l.d+'일차':''}</span>
      <span class="sx" style="color:${c}">${esc(l.t)}</span></div>`;
  });
  return h+'</div>';
}

/* ───────── 의뢰 결산 ───────── */
function resolveQuest(q,out){
  const party=q.sent.ids.map(id=>G.hunters.find(h=>h.id===id)).filter(Boolean);
  if(!party.length)return;
  const ev=evaluate(q,party,true);
  const roll=rnd()*100;
  let res,rm,xm;
  if(roll<ev.p-60){res='대성공';rm=1.6;xm=1.4;}
  else if(roll<ev.p){res='성공';rm=1;xm=1;}
  else if(roll<ev.p+17){res='절반 성공';rm=0.42;xm=0.55;}
  else {res='실패';rm=0;xm=0.28;}

  const gold=Math.round(q.reward*rm*ev.rewMul);
  G.gold+=gold; G.earned+=gold; G.mo.income+=gold;
  G.mo.quests++; if(res==='실패')G.mo.fails++;
  const rk=QT[q.type].rep;
  let rd=res==='실패'?-q.d*0.9:(res==='절반 성공'?q.d*0.4:q.d*1.7*(res==='대성공'?1.4:1));
  if(rd>0)rd*=Math.max(0.12,1-G.rep[rk]/115);   // 명성은 올라갈수록 더디게 오른다
  G.rep[rk]=cl(G.rep[rk]+rd,0,100);
  if(res!=='실패'){
    G.done++;G.donePts=(G.donePts||0)+q.d*q.d*0.55;
    if(q.place){G.region=G.region||{};G.region[q.place]=(G.region[q.place]||0)+1;}
    party.forEach(h=>{G.mo.contrib[h.id]=(G.mo.contrib[h.id]||0)+q.d*q.d;});
    if(q.d>=3){G.mo.hard++;G.mo.h3++;}
    if(q.d>=4)G.mo.h4++;
    if(G.goal&&!G.goal.done){
      if(G.goal.k==='quests')G.goal.c++;
      if(G.goal.k==='hard'&&q.d>=G.goal.min)G.goal.c++;
    }
  }
  // 위협 의뢰 결판
  if(q.threat&&G.threat&&G.threat.qid===q.id){
    if(res==='실패'){
      if(G.day>=G.threat.day)fireThreat();
      else{
        // 기한이 남았으면 게시판에 다시 걸어 재도전을 허용한다
        const again={...q}; delete again.sent; delete again.result;
        again.id=G.nextId++; G.threat.qid=again.id;
        G.quests.unshift(again);
        push(`${G.threat.ic} ${G.threat.name} 저지 실패. 아직 ${G.threat.day-G.day}일 남았습니다.`,'bad');
      }
    } else {
      G.threat.done=true;G.threat.won=true;
      const tg=G.threat.d*4.5*Math.max(0.15,1-G.rep[G.threat.rep]/115);
      G.rep[G.threat.rep]=cl(G.rep[G.threat.rep]+tg,0,100);G.threat.repGain=Math.round(tg);
      G.donePts=(G.donePts||0)+G.threat.d*G.threat.d*1.6;
      G.mo.threatWin++; G.thWin=(G.thWin||0)+1;
      G.hunters.forEach(h=>h.loyalty=cl(h.loyalty+4,0,100));
      push(`${G.threat.ic} ${G.threat.name} 저지 성공! ${REPN[G.threat.rep]}이 크게 올랐습니다.`,'good');
      G.queue.push({type:'threatWin'});
    }
  }

  // 경험치
  const lvups=[];
  party.forEach(h=>{
    let xp=Math.round(q.d*q.d*40*xm);
    if(h.traits.includes('학습광'))xp=Math.round(xp*1.25);
    if(h.traits.includes('전투광')&&q.type==='토벌')xp=Math.round(xp*1.12);
    h.xp+=xp; h.quests++;
    if(res!=='실패')h.wins++;
    let fa=(ev.days*(5+q.d*1.4));
    if(h.traits.includes('강철위장'))fa*=0.7;
    h.fatigue=cl(h.fatigue+fa,0,100);
    while(h.xp>=xpNeed(h.lv)){
      h.xp-=xpNeed(h.lv);h.lv++;
      const g=grow(h);
      lvups.push({h,g});
      h.hist=h.hist||[];h.hist.push({d:G.day,p:power(h)});
      if(h.hist.length>60)h.hist.shift();
    }
    // 충성도
    let dl=res==='실패'?-3:2;
    if(PERSONA[h.pers].like.includes(q.type))dl+=3;
    if(PERSONA[h.pers].dis.includes(q.type))dl-=3;
    if(h.fatigue>82)dl-=4;
    h.loyalty=cl(h.loyalty+dl,0,100);
  });

  // 관계 · 숙련도 변동
  if(party.length>1){
    let dv=res==='실패'?-5:(res==='대성공'?6:3.5);
    if(res==='절반 성공')dv=-1;
    for(let i=0;i<party.length;i++)for(let j=i+1;j<party.length;j++){
      let v=dv;
      if(party[i].pers===party[j].pers)v+=1;
      if((CLASH[party[i].pers]||[]).includes(party[j].pers))v-=3;
      // 탐욕·오만은 실패를 남 탓한다
      if(res==='실패'&&(party[i].traits.includes('탐욕')||party[j].traits.includes('탐욕')))v-=2;
      if(res==='실패'&&(party[i].pers==='오만함'||party[j].pers==='오만함'))v-=2;
      addRel(party[i].id,party[j].id,v);
    }
    bumpTeam(party.map(h=>h.id),res==='실패'?-1:1);
  }
  // 부상
  const inj=[];
  party.forEach(h=>{
    const gap=cl(ev.reqPow/party.reduce((a,x)=>a+power(x),0)-1,0,1.2);
    let c=4+gap*38+q.d*1.6+ev.injAdd*0.8;
    if(res==='실패')c*=1.9; else if(res==='절반 성공')c*=1.35;
    if(h.traits.includes('불굴'))c*=0.55;
    if(h.traits.includes('유리몸'))c*=1.6;
    const sy2=partySync(party); if(sy2&&sy2.lv>=2)c*=0.82;
    if(chance(cl(c,2,52))){
      const r=rnd()*100;
      const t=r<58?'light':(r<89?'mid':'heavy');
      let d=ri(INJ[t].d[0],INJ[t].d[1]);
      d=Math.round(d*(1-FAC.heal.v[G.fac.heal-1]/100)*(h.traits.includes('유리몸')?1.5:1));
      d=Math.max(1,d);
      h.injury={t,left:d};
      // 왜 다쳤는가
      let why='';
      const worst=Object.keys(ev.reqs).map(k=>({k,r:eff(h,k)/ev.reqs[k]})).sort((a,b)=>a.r-b.r)[0];
      if(worst&&worst.r<1){
        why=`${STATN[worst.k]} ${eff(h,worst.k)} — 요구 ${ev.reqs[worst.k]}. `;
        const slot=worst.k==='atk'?'무기':worst.k==='def'?'방어구':'장신구';
        why+=`${slot}를 지급했다면 결과가 달랐을 수 있습니다.`;
      } else if(h.fatigue>70) why=`출발 시 피로도가 높았습니다.`;
      else why=`난이도 대비 파티 규모가 부족했습니다.`;
      inj.push({h,t,d,why});
    }
  });

  if(inj.length&&party.length>1){
    inj.forEach(i=>party.forEach(o=>{ if(o.id!==i.h.id)addRel(i.h.id,o.id,INJ[i.t].out?-3:-1); }));
  }
  // 해제
  party.forEach(h=>{h.busy=null;h.party=null;});
  q.result={res,gold,ev,inj,lvups,party:party.map(h=>h.name),
            story:makeStory(q,party,ev,res,inj)};
  out.push(q);
  G.active=G.active.filter(x=>x.id!==q.id);
  const icon=res==='실패'?'❌':(res==='대성공'?'🏆':'✅');
  push(`${icon} ${q.name} — ${res} (${gold>0?'+'+fmt(gold)+'G':'보상 없음'})`,res==='실패'?'bad':'good',q.result?q:null);
  checkGoal();
}

/* ───────── 하루 진행 ───────── */
function stepDay(out){
  G.day++;
  // 현장 사건 — 복귀보다 먼저 처리해야 선택이 결과에 반영된다
  (G.active||[]).forEach(q=>{
    if(q.field&&!q.field.done&&G.day>=q.field.day){
      q.field.done=true;
      G.queue.push({type:'field',qid:q.id});
    }
  });
  // 복귀
  (G.active||[]).slice().forEach(q=>{if(G.day>=q.sent.end)resolveQuest(q,out);});
  // 훈련 종료
  G.hunters.forEach(h=>{
    if(h.busy&&h.busy.type==='train'&&G.day>=h.until){
      const k=h.busy.stat, lvl=FAC.train.v[G.fac.train-1];
      let g=h.busy.days*(1.05+lvl/100);
      if(h.traits.includes('천재'))g*=1.25;
      if(h.traits.includes('게으름'))g*=0.65;
      g=Math.max(1,Math.round(g));
      const before=h.stats[k];
      h.stats[k]=Math.min(h.caps[k],h.stats[k]+g);
      const real=h.stats[k]-before;
      h.xp+=h.busy.days*18;
      while(h.xp>=xpNeed(h.lv)){h.xp-=xpNeed(h.lv);h.lv++;grow(h);}
      h.busy=null;
      push(`🏋️ ${h.name} 훈련 완료 — ${STATN[k]} ${sgn(real)}${real<g?' (한계 도달)':''}`,real>0?'good':'bad');
    }
  });
  // 강제 휴식 종료
  G.hunters.forEach(h=>{
    if(h.busy&&h.busy.type==='rest'&&G.day>=h.until){
      h.busy=null;push(`😌 ${h.name} 휴식 종료.`,'info');
    }
  });
  // 회복
  const rec=6+FAC.dorm.v[G.fac.dorm-1]*1.2;
  G.hunters.forEach(h=>{
    if(!h.busy)h.fatigue=cl(h.fatigue-rec,0,100);
    else if(h.busy.type==='rest')h.fatigue=cl(h.fatigue-rec*2.4,0,100);
    else h.fatigue=cl(h.fatigue-0.6,0,100);
    if(h.injury){h.injury.left--;if(h.injury.left<=0){h.injury=null;push(`🩹 ${h.name} 부상에서 회복했습니다.`,'good');}}
    h.contract--;
  });
  // 게시판
  G.quests=G.quests.filter(q=>{
    if(q.threat)return true;
    if(G.day>q.deadline){push(`📋 「${q.name}」 의뢰 기한이 지나 취소되었습니다.`,'bad');return false;}
    return true;
  });
  if(G.quests.length<9&&chance(85))G.quests.push(mkQuest());
  while(G.quests.length<5)G.quests.push(mkQuest());
  // 위협
  if(G.threat&&!G.threat.done&&G.day>=G.threat.day)fireThreat();
  if((!G.threat||G.threat.done)&&G.day>=G.nextThreat){
    spawnThreat();
    G.nextThreat=G.day+ri(18,26);
  }
  // 주급
  if(G.day%7===0)payday();
  // 모집 후보
  if(G.day-G.lastRecruit>=7)rollCands();
  // 계약 / 스카우트
  contractCheck();
  // 월말
  if(G.day%30===0)monthEnd();
  // 성장 기록 (5일마다 표본)
  if(G.day%5===0)G.hunters.forEach(h=>{
    h.hist=h.hist||[];
    h.hist.push({d:G.day,p:power(h)});
    if(h.hist.length>60)h.hist.shift();
  });
  // 개인 사건
  if(chance(11))personalEvent();
  checkGoal();
}
// 시설을 전부 최대로 올리는 것이 무조건 정답이 되지 않도록 유지비를 붙인다.
function upkeep(){
  let u=0;
  for(const k in FAC)u+=Math.round(42*Math.pow(G.fac[k],1.9));
  u+=G.hunters.length*40;
  return Math.round(u);
}
function payday(){
  const wage=G.hunters.reduce((a,h)=>a+h.salary,0)+G.inst.reduce((a,i)=>a+i.salary,0);
  const up=upkeep();
  let s=wage+up;
  if(G.gold>=s){G.gold-=s;G.mo.expense+=s;G.mo.wage=(G.mo.wage||0)+wage;G.mo.up=(G.mo.up||0)+up;
    push(`💸 주급 ${fmt(wage)}G · 유지비 ${fmt(up)}G 지출`,'info');}
  else{
    G.gold=0;
    G.hunters.forEach(h=>h.loyalty=cl(h.loyalty-8,0,100));
    push(`⚠️ 자금 부족! 운영비 ${fmt(s)}G를 감당하지 못해 전원 충성도가 크게 떨어졌습니다.`,'bad');
  }
}
function contractCheck(){
  G.hunters.slice().forEach(h=>{
    if(h.contract<=0){
      if(h.busy){h.contract=1;return;}   // 원정 중에는 떠나지 않는다
      leave(h,h.offer?h.offer.g:pick(G.rivals).n,'계약 만료');
      return;
    }
    if(h.contract<=30&&!h.offer&&chance(2.4+ (100-h.loyalty)*0.05)&&power(h)>60){
      const rv=pick(G.rivals);
      h.offer={g:rv.n,salary:Math.round(h.salary*(1.6+rnd()*1.1))};
      G.queue.push({type:'poach',hid:h.id});
    }
  });
}
function leave(h,to,why){
  G.hunters=G.hunters.filter(x=>x.id!==h.id);
  if(G.rel)for(const k in G.rel)if(k.split('~').includes(String(h.id)))delete G.rel[k];
  if(G.teams)for(const k in G.teams)if(k.split('.').includes(String(h.id)))delete G.teams[k];
  G.active=(G.active||[]).filter(q=>!q.sent.ids.includes(h.id));
  G.moves.unshift({day:G.day,name:h.name,to,pw:power(h),why});
  const rv=G.rivals.find(r=>r.n===to);if(rv)rv.p+=Math.round(power(h)*0.55);
  push(`🚪 ${ga(h.name)} ${to} 길드로 이적했습니다. (${why})`,'bad');
}
function monthEnd(){
  // 라이벌 성장
  G.rivals.forEach(r=>r.p=Math.round(r.p*(1.012+rnd()*0.028)));
  // 월별 추이 기록
  {
    const l=G.rivals.map(r=>({p:r.p})).concat([{p:myPower(),me:1}]).sort((a,b)=>b.p-a.p);
    G.hist=G.hist||[];
    G.hist.push({m:G.month,gold:Math.round(G.gold),pts:guildPts(),
                 rank:l.findIndex(x=>x.me)+1,pw:myPower()});
    if(G.hist.length>36)G.hist.shift();
  }
  // 노화 / 은퇴
  G.hunters.slice().forEach(h=>{
    if(G.day%360===0){h.age++;}
    if(h.age>=31&&chance((h.age-30)*7)){
      const k=pick(['atk','agi','hp']);
      h.stats[k]=Math.max(8,h.stats[k]-ri(1,3));
      h.caps[k]=Math.max(h.stats[k],h.caps[k]-1);
    }
    if(h.age>=34){
      h.retiring=true;
      if(!h.busy&&chance((h.age-33)*11))G.queue.push({type:'retire',hid:h.id});
    }
    if(h.traits.includes('방랑벽'))h.loyalty=cl(h.loyalty-6,0,100);
  });
  // 성격 충돌은 시간이 지나며 벌어진다
  for(let i=0;i<G.hunters.length;i++)for(let j=i+1;j<G.hunters.length;j++){
    const a=G.hunters[i],b=G.hunters[j];
    if((CLASH[a.pers]||[]).includes(b.pers)&&chance(35))addRel(a.id,b.id,-ri(1,3));
    if(a.traits.includes('탐욕')&&b.traits.includes('탐욕')&&chance(30))addRel(a.id,b.id,-ri(1,3));
  }
  // 오래 쓰지 않은 조합은 호흡이 무뎌진다
  if(G.teams)for(const k in G.teams){
    const t=G.teams[k];
    if(G.day-t.last>45){t.n=Math.max(0,t.n-2);t.last=G.day-30;}
    if(t.n<=0)delete G.teams[k];
  }
  push(`📊 ${G.month}개월차 결산이 도착했습니다.`,'info');
  G.queue.push({type:'monthly'});
}
function personalEvent(){
  const free=G.hunters.filter(h=>!h.busy);
  if(free.length<1)return;
  const h=pick(free);
  const pool=[];
  if(free.length>=2){
    const others=free.filter(x=>x.id!==h.id).sort((a,b)=>rel(h.id,a.id)-rel(h.id,b.id));
    const o=chance(65)?others[0]:pick(others);
    if(o&&rel(h.id,o.id)<35)pool.push({type:'quarrel',hid:h.id,oid:o.id});
  }
  if(h.loyalty<55)pool.push({type:'complain',hid:h.id});
  if(h.fatigue>60)pool.push({type:'burnout',hid:h.id});
  pool.push({type:'ask',hid:h.id});
  if(pool.length)G.queue.push(pick(pool));
}
function push(text,kind,q){
  G.log.unshift({day:G.day,text,kind:kind||'info',q:q?q.id:null,
    report:q?{name:q.name,r:q.result}:null});
  if(G.log.length>60)G.log.pop();
}

/* ───────── 진행 실행 ───────── */
function advance(n){
  const out=[];
  let moved=0;
  for(let i=0;i<n;i++){
    if(G.queue.length)break;
    stepDay(out);
    moved++;
    if(G.queue.length)break;
  }
  save();
  if(out.length)showSettle(out,moved);
  else if(G.queue.length)nextQueue();
  else {render();toast(`${moved}일이 지났습니다.`);}
}
function advanceUntilReturn(){
  if(!G.active||!G.active.length){advance(1);return;}
  const end=Math.min(...G.active.map(q=>q.sent.end));
  advance(Math.max(1,end-G.day));
}

/* ───────── 모집 ───────── */
function rollCands(){
  G.lastRecruit=G.day;
  const n=3+FAC.rec.v[G.fac.rec-1];
  G.cands=[];
  for(let i=0;i<n;i++){
    const bonus=FAC.rec.v[G.fac.rec-1]*4;
    let h=mkHunter({pot:cl(Math.round(36+rnd()*rnd()*60+bonus+ri(-3,6)),28,97),lv:ri(1,3)+Math.floor(guildPts()/160)});
    // 교관 특성 전수
    if(G.inst.length&&chance(26+G.inst.length*8)){
      const t=pick(G.inst).trait;
      if(t&&!h.traits.includes(t)&&h.traits.length<3)h.traits.push(t);
    }
    h.fee=Math.round((power(h)*11+h.pot*7)/10)*10;
    G.cands.push(h);
  }
}

function render(){
  const g=guildGrade();
  $('#top').innerHTML=
    `<span class="gname">${esc(G.name)}</span><span class="grade">${g}급</span>`+
    `<span class="gold">${fmt(G.gold)}G</span>`;
  const alerts=G.queue.length;
  const tabs=[['home','🏠','홈'],['hunters','👥','헌터'],['quests','⚔️','의뢰'],['guild','🏰','길드'],['rank','📊','랭킹']];
  $('#tabs').innerHTML=tabs.map(([k,i,n])=>
    `<button data-tab="${k}" class="${TAB===k?'on':''}"><span class="ti">${i}</span>${n}${k==='home'&&alerts?'<span class="dot"></span>':''}</button>`).join('');
  const v=$('#view');
  v.innerHTML=({home:vHome,hunters:vHunters,quests:vQuests,guild:vGuild,rank:vRank})[TAB]();
  v.scrollTop=0;window.scrollTo(0,0);
}

function briefHTML(){
  const B=[];let next=null;
  const t=G.threat&&!G.threat.done?G.threat:null;
  const idle=G.hunters.filter(avail);
  if(t){
    const q=G.quests.find(x=>x.id===t.qid);
    const out=(G.active||[]).some(x=>x.id===t.qid);
    B.push({k:t.ic,t:`${t.name} 발생까지`,v:`D-${Math.max(0,t.day-G.day)}`,hot:!out});
    if(!out&&q)next={t:'위기 대응 파티 편성',a:'quests'};
  }
  if(G.queue.length){B.push({k:'🔔',t:'처리 대기 중인 결정',v:`${G.queue.length}건`,hot:1});
    if(!next)next={t:'대기 중인 결정 처리',a:'queue'};}
  const hurt=G.hunters.filter(h=>h.injury);
  if(hurt.length)B.push({k:'🩹',t:'부상 중',v:`${hurt.length}명 (최장 ${Math.max(...hurt.map(h=>h.injury.left))}일)`,hot:hurt.length>=3});
  const due=G.quests.filter(q=>!q.threat&&q.deadline-G.day<=1);
  if(due.length)B.push({k:'📋',t:'오늘·내일 마감 의뢰',v:`${due.length}건`,hot:1});
  const cost=G.hunters.reduce((a,h)=>a+h.salary,0)+G.inst.reduce((a,i)=>a+i.salary,0)+upkeep();
  const dleft=7-(G.day%7||7)+1;
  B.push({k:'💰',t:`주급일까지 ${dleft}일 · 필요`,v:`${fmt(cost)}G`,hot:G.gold<cost});
  if(G.gold<cost&&!next)next={t:'자금 확보 — 보상 높은 의뢰 파견',a:'quests'};
  const exp=G.hunters.filter(h=>h.contract<=21).sort((a,b)=>a.contract-b.contract);
  if(exp.length)B.push({k:'✍️',t:`계약 만료 임박 · ${exp[0].name}`,v:`D-${exp[0].contract}`,hot:exp[0].contract<=10});
  if(idle.length)B.push({k:'🧍',t:'대기 중인 헌터',v:`${idle.length}명 / ${G.hunters.length}명`,hot:0});
  if(G.goal&&!G.goal.done)B.push({k:'🎯',t:`이달의 과제 · ${G.goal.txt}`,
    v:`${Math.round(goalProgress()*100)}%`,hot:0});
  const bad=[];
  for(const k in (G.rel||{})){ if(G.rel[k]<=-40)bad.push(k); }
  if(bad.length)B.push({k:'💢',t:'불화 관계',v:`${bad.length}쌍 — 같은 파티 편성 주의`,hot:0});
  if(idle.length&&G.quests.length&&!next)next={t:`대기 중인 헌터 ${idle.length}명 파견`,a:'quests'};
  if(!B.length)return '';
  let h=`<div class="brief">`;
  B.slice(0,5).forEach(x=>h+=`<div class="bi ${x.hot?'hot':''}">
    <span class="bk">${x.k}</span><span class="bt">${esc(x.t)}</span><span class="bv">${x.v}</span></div>`);
  if(next)h+=`<div class="nx"><span>가장 급한 일 · <b>${esc(next.t)}</b></span>
    <button data-act="${next.a==='queue'?'queue':'go'}" data-tab2="${next.a}">이동</button></div>`;
  return h+`</div>`;
}

function vHunters(){

  let h=`<div class="sec"><h2>소속 헌터 ${G.hunters.length} / ${maxHunters()}</h2><div class="ledger">`;
  sorted.forEach(x=>{
    const [g,c]=gradeOf(x);
    let st='',cls='';
    if(x.busy&&x.busy.type==='quest'){st=`파견 중 · D-${Math.max(0,x.until-G.day)}`;}
    else if(x.busy&&x.busy.type==='train'){st=`훈련 중 · D-${Math.max(0,x.until-G.day)}`;}
    else if(x.injury){st=`${INJ[x.injury.t].n} · ${x.injury.left}일 남음`;cls='b';}
    else st='대기';
    const tags=[];
    if(x.offer)tags.push('<span class="tag b">영입 제안</span>');
    if(x.contract<=30)tags.push(`<span class="tag y">계약 D-${x.contract}</span>`);
    if(x.retiring)tags.push('<span class="tag">은퇴 임박</span>');
    if(x.loyalty<35)tags.push('<span class="tag b">불만</span>');
    const sp=(x.hist||[]).length>3?`<span class="spark" style="display:inline-block;width:42px">${sparkline(x.hist.slice(-14),42,14,'#647680',0)}</span>`:'';
    h+=`<button class="row" data-act="hunter" data-id="${x.id}">
      ${sigil(x,30)}
      <span class="mid"><span class="n">${esc(x.name)}
        <span class="tag" style="color:${c};border-color:${c}">${g}</span>${tags.join('')}</span>
        <span class="s" ${cls==='b'?'style="color:var(--blood)"':''}>${CLASSES[x.cls].ic} ${x.cls} Lv.${x.lv} · ${x.age}세 · ${st} · 피로 ${Math.round(x.fatigue)}%</span></span>
      <span class="rt"><b>${power(x)}</b>${sp||'전투력'}</span></button>`;
  });
  h+=`</div></div>`;

  if(G.inst.length){
    h+=`<div class="sec"><h2>교관</h2><div class="ledger">`;
    G.inst.forEach(i=>{
      h+=`<div class="row"><span class="ic">🎓</span><span class="mid">
        <span class="n">${esc(i.name)}</span>
        <span class="s">${i.cls} 출신 · 훈련 효과 +6% · 전수 특성 ${i.trait?TRAITS[i.trait].ic+i.trait:'없음'}</span></span>
        <span class="rt"><b>${fmt(i.salary)}G</b>주급</span></div>`;

  return h;

  h+=`</div><div class="ledger">`;
  for(const k in ITEMS){
    const it=ITEMS[k];if(it.t!==SHOP_T)continue;
    const own=G.stock.filter(x=>x===k).length+G.hunters.filter(hh=>Object.values(hh.equip).includes(k)).length;
    h+=`<div class="row"><span class="ic">${it.t==='무기'?'⚔️':it.t==='방어구'?'🛡️':'💍'}</span>
      <span class="mid"><span class="n">${it.n}${own?` <span class="tag">보유 ${own}</span>`:''}</span>
      <span class="s">${STATN[it.s]} +${it.v}</span></span>
      <button data-act="buy" data-k="${k}" style="background:var(--panel2);border:1px solid var(--line2);border-radius:3px;padding:6px 11px;font-size:12px;font-weight:600" ${G.gold<it.p?'disabled':''}>${fmt(it.p)}G</button></div>`;
  }
  h+=`</div><div class="note" style="margin-top:8px">창고: ${G.stock.length?G.stock.map(k=>ITEMS[k].n).join(', '):'비어 있음'}</div></div>`;

  h+=`<div class="sec"><h2>저장</h2>
    <div class="up"><div><b>수동 저장</b><div class="tiny">진행할 때마다 자동 저장됩니다</div></div>
    <button data-act="reset">새로 시작</button></div></div>`;
  return h;
}

function vRank(){
  const list=G.rivals.map(r=>({n:r.n,p:r.p,me:0})).concat([{n:G.name,p:myPower(),me:1}])
    .sort((a,b)=>b.p-a.p);
  let h=`<div class="sec"><h2>길드 랭킹</h2><div class="ledger">`;
  list.forEach((r,i)=>{
    h+=`<div class="row" style="${r.me?'background:#242C1D':''}">
      <span class="ic" style="color:${i===0?'var(--brass)':'var(--dim2)'}">${i+1}</span>
      <span class="mid"><span class="n">${esc(r.n)}${r.me?' <span class="tag y">우리</span>':''}</span></span>
      <span class="rt"><b>${fmt(r.p)}</b>세력</span></div>`;
  });
  h+=`</div><div class="note" style="margin-top:8px">세력은 상위 5명의 전투력 합계와 길드 실적으로 계산됩니다.</div></div>`;

  const tr=trendChart('rank','길드 순위','#7B8FCB',1)+trendChart('pts','길드 점수','#C9A227',0)+trendChart('gold','자금','#6F9E5A',0);
  if(tr)h+=`<div class="sec"><h2>성장 추이</h2>${tr}</div>`;
  else h+=`<div class="sec"><h2>성장 추이</h2><div class="empty">2개월이 지나면 성장 곡선이 나타납니다.</div></div>`;

  h+=`<div class="sec"><h2>이적 기록</h2>`;
  if(!G.moves.length)h+=`<div class="empty">아직 떠난 헌터가 없습니다.</div>`;
  G.moves.slice(0,12).forEach(m=>{
    h+=`<div class="row"><span class="ic">🚪</span><span class="mid">
      <span class="n">${esc(m.name)} → ${esc(m.to)}</span>
      <span class="s">${m.day}일차 · ${m.why} · 당시 전투력 ${m.pw}</span></span></div>`;
  });
  h+=`</div>`;

  h+=`<div class="sec"><h2>길드 실적</h2><div class="ledger">
    <div class="row"><span class="mid"><span class="n">완료한 의뢰</span></span><span class="rt"><b>${G.done}</b>건</span></div>
    <div class="row"><span class="mid"><span class="n">누적 수입</span></span><span class="rt"><b>${fmt(G.earned)}</b>G</span></div>
    <div class="row"><span class="mid"><span class="n">위기 대응</span></span><span class="rt"><b>${G.thWin||0}</b>저지 / ${(G.thWin||0)+(G.thFail||0)}건</span></div>
    <div class="row"><span class="mid"><span class="n">길드 점수</span></span><span class="rt"><b>${guildPts()}</b>점</span></div>
  </div>`;
  const gi=GRADES.findIndex(x=>x[0]===guildGrade());
  if(gi<GRADES.length-1)h+=`<div class="note" style="margin-top:8px">${GRADES[gi+1][0]}급까지 ${GRADES[gi+1][1]-guildPts()}점 남았습니다.</div>`;
  return h;
}

/* ══════════════════════════════════════════════════
   모달

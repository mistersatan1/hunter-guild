let MB=[];
function modal(title,sub,body,btns,noclose){
  MB=btns||[];
  $('#mroot').className='on';
  $('#mroot').innerHTML=`<div class="modal">
    <h3>${title}</h3>${sub?`<div class="sub">${sub}</div>`:''}
    <div>${body}</div>
    <div class="mbtns">${MB.map((b,i)=>`<button data-mb="${i}" class="${b.p?'p':''}" ${b.dis?'disabled':''}>${b.l}</button>`).join('')}</div>
  </div>`;
  $('#mroot').dataset.noclose=noclose?'1':'';
}
function closeM(){$('#mroot').className='';$('#mroot').innerHTML='';MB=[];}
function toast(t){
  const d=document.createElement('div');
  d.textContent=t;
  d.style.cssText='position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);color:var(--text);padding:8px 15px;border-radius:20px;font-size:13px;z-index:80;white-space:nowrap';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),1700);
}

/* ── 헌터 상세 ── */
function mHunter(id){
  const h=G.hunters.find(x=>x.id===id);if(!h)return;
  const [g,c]=gradeOf(h);
  let b='';
  if(h.offer)b+=`<div class="warn">📨 <b>${h.offer.g}</b> 길드가 ${h.name}에게 주급 <b>${fmt(h.offer.salary)}G</b>를 제안했습니다. (현재 ${fmt(h.salary)}G)<br>계약 만료까지 <b>${h.contract}일</b>.</div>`;
  else if(h.contract<=30)b+=`<div class="warn">계약 만료까지 ${h.contract}일. 재계약하지 않으면 다른 길드로 떠납니다.</div>`;
  if(h.injury)b+=`<div class="warn">${INJ[h.injury.t].n} — 회복까지 ${h.injury.left}일. 능력치 -${Math.round(INJ[h.injury.t].pen*100)}%${h.injury.t!=='light'?' · 파견 불가':''}</div>`;
  if(h.retiring)b+=`<div class="warn" style="background:#2A2620;border-color:#5A4E33;color:#D6C79B">${h.age}세. 은퇴를 고려하고 있습니다. 은퇴 시 교관으로 남길 수 있습니다.</div>`;

  b+=`<div style="display:flex;gap:13px;align-items:center;margin-bottom:4px">
    ${sigil(h,56)}
    <div style="flex:1;min-width:0">
      <div style="font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1">${power(h)}</div>
      <div class="tiny">전투력 · ${h.cls} Lv.${h.lv} · ${potShown(h)}</div>
    </div></div>`;
  b+=growthChart(h);
  b+=`<div class="stats">`;
  SKEYS.forEach(k=>{
    const v=eff(h,k),base=h.stats[k],cap=h.caps[k];
    const bonus=v-base+(h.injury?Math.round(base*INJ[h.injury.t].pen):0);
    const hi=CLASSES[h.cls].w[k]>=1.3;
    b+=`<div class="st ${hi?'hi':''}"><div class="sl"><span>${STATN[k]}</span>
      <b>${v}${bonus>0?` <span style="color:var(--moss);font-size:11px">+${bonus}</span>`:''} <span class="tiny">/${cap}</span></b></div>
      <div class="bar"><i style="width:${cl(base/99*100,2,100)}%"></i></div></div>`;
  });
  b+=`</div>`;
  b+=`<div class="rep-l"><span class="lb">경험치</span><span class="vl">${h.xp} / ${xpNeed(h.lv)}</span></div>
   <div class="rep-l"><span class="lb">${potShown(h)}</span><span class="vl">${h.pot>=85?'특급':h.pot>=70?'우수':h.pot>=55?'보통':'제한적'}</span></div>
   <div class="rep-l"><span class="lb">충성도</span><span class="vl" style="color:${h.loyalty<40?'var(--blood)':h.loyalty>75?'var(--moss)':''}">${h.loyalty}</span></div>
   <div class="rep-l"><span class="lb">피로도</span><span class="vl" style="color:${h.fatigue>70?'var(--blood)':''}">${Math.round(h.fatigue)}%</span></div>
   <div class="rep-l"><span class="lb">주급 / 계약</span><span class="vl">${fmt(h.salary)}G · D-${h.contract}</span></div>
   <div class="rep-l"><span class="lb">의뢰 수행</span><span class="vl">${h.quests}건 (성공 ${h.wins})</span></div>`;

  b+=`<div style="margin-top:11px"><div class="tiny" style="margin-bottom:5px">성격 · ${h.pers}</div>
    <div class="hint" style="margin-top:0">${PERSONA[h.pers].d}</div></div>`;
  b+=`<div style="margin-top:11px"><div class="tiny" style="margin-bottom:5px">특성</div>`;
  h.traits.forEach(t=>b+=`<div class="rep-l ${TRAITS[t].g?'p':'n'}"><span class="lb">${TRAITS[t].ic} ${t}</span><span class="vl" style="font-weight:400;font-size:11.5px;color:var(--dim)">${TRAITS[t].d}</span></div>`);
  b+=`</div>`;

  const mates=G.hunters.filter(x=>x.id!==h.id)
    .map(x=>({x,v:rel(h.id,x.id)})).sort((a,b2)=>Math.abs(b2.v)-Math.abs(a.v)).slice(0,4);
  if(mates.length){
    b+=`<div style="margin-top:13px"><div class="tiny" style="margin-bottom:5px">길드 내 관계</div>`;
    mates.forEach(m=>{
      const [lb,col]=relLabel(m.v);
      const w=Math.abs(m.v)/2;
      b+=`<div class="rel-l"><span class="rn">${esc(m.x.name)}</span>
        <span style="color:${col};font-size:11.5px">${lb} ${m.v>0?'+':''}${Math.round(m.v)}</span>
        <span class="rb"><i style="left:${m.v>=0?50:50-w}%;width:${w}%;background:${col}"></i></span></div>`;
    });
    b+=`</div>`;
  }
  b+=`<div style="margin-top:11px"><div class="tiny" style="margin-bottom:5px">장비</div>`;
  ['무기','방어구','장신구'].forEach(s=>{
    const it=h.equip[s];
    b+=`<div class="up" style="padding:7px 0"><div><b style="font-size:13px">${it?ITEMS[it].n:'—'}</b>
      <div class="tiny">${s}${it?` · ${STATN[ITEMS[it].s]} +${ITEMS[it].v}`:' · 미장착'}</div></div>
      <button data-act="equip" data-id="${h.id}" data-s="${s}">${it?'교체':'장착'}</button></div>`;
  });
  b+=`</div>`;

  const btns=[];
  if(h.offer)btns.push({l:'재계약 협상',p:1,fn:()=>mResign(h.id)});
  else if(h.contract<=60)btns.push({l:'재계약',p:1,fn:()=>mResign(h.id)});
  if(!h.busy&&(!h.injury||h.injury.t==='light'))btns.push({l:'훈련 배정',fn:()=>mTrain(h.id)});
  btns.push({l:'닫기',fn:closeM});
  modal(`${CLASSES[h.cls].ic} ${esc(h.name)} <span class="tag" style="color:${c};border-color:${c};font-size:12px">${g}</span>`,
    `${h.cls} · ${h.age}세 · ${h.busy?(h.busy.type==='quest'?'파견 중':'훈련 중'):'대기'}`,b,btns);
}

/* ── 훈련 ── */
function mTrain(id){
  const h=G.hunters.find(x=>x.id===id);if(!h)return;
  const lvl=FAC.train.v[G.fac.train-1];
  let b=`<div class="note" style="margin-bottom:10px">훈련 중에는 의뢰에 나갈 수 없습니다. 기간이 길수록 상승폭이 큽니다.<br>훈련장 Lv.${G.fac.train} 보정 +${lvl}%${h.traits.includes('천재')?' · 🧠 천재 +25%':''}${h.traits.includes('게으름')?' · 😴 게으름 -35%':''}${G.inst.length?` · 교관 ${G.inst.length}명`:''}</div>`;
  b+=`<div class="tiny" style="margin-bottom:6px">능력치 선택</div>`;
  SKEYS.forEach(k=>{
    const capped=h.stats[k]>=h.caps[k];
    b+=`<button class="pick ${TRAINK===k?'on':''} ${capped?'off':''}" data-act="tk" data-k="${k}" ${capped?'disabled':''}>
      <span class="box"></span><span style="flex:1">${STATN[k]} <span class="tiny">${h.stats[k]} / 한계 ${h.caps[k]}</span></span>
      ${capped?'<span class="tag">한계 도달</span>':''}</button>`;
  });
  b+=`<div class="tiny" style="margin:11px 0 6px">기간 · 비용 · 피로</div>`;
  [[3,600,14],[5,1100,24],[8,2000,40]].forEach(([d,c,f])=>{
    b+=`<button class="pick ${TRAIND===d?'on':''}" data-act="td" data-d="${d}">
      <span class="box"></span><span style="flex:1">${d}일 훈련</span>
      <span class="tiny">${fmt(c)}G · 피로 +${f}</span></button>`;
  });
  const cost={3:600,5:1100,8:2000}[TRAIND];
  modal('훈련 배정',esc(h.name),b,[
    {l:`시작 · ${fmt(cost)}G`,p:1,dis:!TRAINK||G.gold<cost||h.stats[TRAINK]>=h.caps[TRAINK],fn:()=>{
      const f={3:14,5:24,8:40}[TRAIND];
      G.gold-=cost;h.busy={type:'train',stat:TRAINK,days:TRAIND};h.until=G.day+TRAIND;
      h.fatigue=cl(h.fatigue+f,0,100);
      push(`🏋️ ${h.name} ${STATN[TRAINK]} 훈련 시작 (${TRAIND}일)`,'info');
      closeM();save();render();
    }},
    {l:'취소',fn:closeM}
  ]);
}
let TRAINK=null,TRAIND=3;

/* ── 장비 ── */
function mEquip(id,slot){
  const h=G.hunters.find(x=>x.id===id);if(!h)return;
  const opts=G.stock.filter(k=>ITEMS[k].t===slot);
  let b='';
  if(h.equip[slot])b+=`<button class="pick" data-act="unequip" data-id="${id}" data-s="${slot}">
    <span style="flex:1">해제 — ${ITEMS[h.equip[slot]].n}</span><span class="tag">창고로</span></button>`;
  if(!opts.length)b+=`<div class="empty">창고에 ${slot}가 없습니다.<br>길드 → 장비 상점에서 구입하세요.</div>`;
  opts.forEach((k,i)=>{
    b+=`<button class="pick" data-act="doequip" data-id="${id}" data-s="${slot}" data-k="${k}" data-i="${i}">
      <span style="flex:1">${ITEMS[k].n}</span><span class="tag g">${STATN[ITEMS[k].s]} +${ITEMS[k].v}</span></button>`;
  });
  modal(slot+' 장착',esc(h.name),b,[{l:'닫기',fn:()=>mHunter(id)}]);
}

/* ── 의뢰 상세 / 파견 ── */
function mQuest(id){
  const q=G.quests.find(x=>x.id===id);if(!q)return;
  const party=SEL.map(i=>G.hunters.find(h=>h.id===i)).filter(Boolean);
  const sd=shownDiff(q);
  let b='';
  b+=`<div class="rep-l"><span class="lb">난이도</span><span class="vl">${q.scouted?stars(q.d):stars(sd)+(FAC.scout.v[G.fac.scout-1]>0?' <span class="tiny">추정</span>':'')}</span></div>
   <div class="rep-l"><span class="lb">기본 보상</span><span class="vl money">${fmt(q.reward)}G</span></div>
   <div class="rep-l"><span class="lb">소요 기간</span><span class="vl">${q.days}일</span></div>
   <div class="rep-l"><span class="lb">접수 기한</span><span class="vl">D-${q.deadline-G.day}</span></div>
   <div class="rep-l"><span class="lb">요구 전투력</span><span class="vl">${q.scouted?q.reqPow:'약 '+Math.round(q.reqPow*(0.9+FAC.scout.v[G.fac.scout-1]/300))}</span></div>`;
  for(const k in q.req)
    b+=`<div class="rep-l"><span class="lb">요구 ${STATN[k]}${k==='mag'?' (최고)':' (평균)'}</span><span class="vl">${q.req[k]}</span></div>`;

  if(q.scouted){
    if(q.hz.length){
      b+=`<div style="margin-top:11px"><div class="tiny" style="margin-bottom:5px">정찰 보고</div>`;
      q.hz.forEach(h=>b+=`<div class="hint" style="margin-top:5px;border-left-color:${h.bad?'var(--blood)':'var(--moss)'}"><b>${h.bad?'⚠️':'✅'} ${h.n}</b><br>${h.d}</div>`);
      b+=`</div>`;
    } else b+=`<div class="hint good" style="margin-top:11px;background:#1E2B1B;border-left-color:var(--moss);color:#A9CE97">✅ 정찰 결과 특이사항 없음. 보고서대로입니다.</div>`;
  } else {
    b+=`<div class="hint" style="border-left-color:var(--brass)">이 의뢰는 <b>정찰하지 않았습니다.</b> 보고된 난이도와 실제가 다를 수 있고, 함정·대군·마법 생물 같은 변수가 숨어 있을 수 있습니다. 반대로 과장된 보고이거나 미발견 매장물이 있을 수도 있습니다.<br>
      <span style="color:var(--brass);font-weight:700">정찰 비용 ${fmt(scoutCost(q))}G</span></div>`;
  }

  // 파티 편성
  b+=`<div style="margin:14px 0 6px" class="tiny">파티 편성 (최대 ${maxParty()}명)</div>`;
  const cands=G.hunters.slice().sort((a,b2)=>power(b2)-power(a));
  cands.forEach(h=>{
    const ok=avail(h), on=SEL.includes(h.id);
    let why='';
    if(h.busy)why=h.busy.type==='quest'?`파견 중 D-${h.until-G.day}`:`훈련 중 D-${h.until-G.day}`;
    else if(h.injury&&h.injury.t!=='light')why=`${INJ[h.injury.t].n} · 출전 불가`;
    else if(h.injury)why=`경상 (능력치 -16%)`;
    else why=`피로 ${Math.round(h.fatigue)}%`;
    b+=`<button class="pick ${on?'on':''} ${ok?'':'off'}" data-act="sel" data-id="${h.id}" ${ok?'':'disabled'}>
      <span class="box"></span>
      <span style="flex:1">${CLASSES[h.cls].ic} ${esc(h.name)} <span class="tiny">${h.cls}</span></span>
      <span class="tiny" style="text-align:right">전투력 ${power(h)}<br>${why}</span></button>`;
  });

  // 팀 궁합
  if(party.length>1){
    const sy=partySync(party);
    const [wl,wc]=relLabel(sy.worst.v);
    b+=`<div class="hint" style="margin-top:9px;border-left-color:${sy.avg<-14?'var(--blood)':sy.lv?'var(--moss)':'var(--line2)'}">
      <b>이 조합</b> · 평균 관계 ${Math.round(sy.avg)}
      ${sy.lv?` · 합동 숙련도 Lv.${sy.lv} (${sy.team.n}회)`:` · 합동 ${sy.team.n}회`}<br>
      <span style="color:${wc}">${esc(sy.worst.a.name)} ↔ ${esc(sy.worst.b.name)} — ${wl} ${sy.worst.v>0?'+':''}${Math.round(sy.worst.v)}</span>
      ${sy.lv<3?`<br><span class="tiny">${teamLv(sy.team.n+1)>sy.lv?'한 번 더 함께 보내면 숙련도가 오릅니다.':`숙련도 Lv.${sy.lv+1}까지 ${[3,8,15][sy.lv]-sy.team.n}회`}</span>`:'<br><span class="tiny">최고 숙련도 — 소요일 -1</span>'}</div>`;
  }
  // 예측
  if(party.length){
    const ev=evaluate(q,party,false);
    if(q.threat&&G.threat&&G.threat.qid===q.id){
      const back=G.day+ev.days, late=back-G.threat.day;
      b+=`<div class="hint" style="margin-top:10px;border-left-color:${late>0?'var(--blood)':'var(--moss)'}">
        <b>${late>0?'⚠️ 늦습니다':'✅ 기한 내 복귀'}</b><br>
        ${back}일차 복귀 · 위기 발생은 ${G.threat.day}일차.
        ${late>0?`${late}일 늦어 막지 못합니다. 더 짧은 편성이 필요합니다.`:'이 편성이면 기한 안에 막을 수 있습니다.'}</div>`;
    }
    b+=`<div style="margin-top:12px;background:var(--panel2);padding:11px;border-radius:3px;border:1px solid var(--line)">
      <div class="tiny" style="margin-bottom:6px">출발 전 예측 — 당신이 아는 정보만 반영됩니다</div>`;
    ev.L.forEach(l=>b+=`<div class="rep-l ${l.k}"><span class="lb">${l.l}</span><span class="vl">${l.v}</span></div>`);
    b+=`<div class="final"><span>예상 성공률</span><span class="big" style="color:${ev.p>=65?'var(--moss)':ev.p>=40?'var(--brass)':'var(--blood)'}">${ev.p}%</span></div>
      <div class="tiny" style="margin-top:5px">복귀 예정 ${ev.days}일 후 · 그동안 이 ${party.length}명은 다른 의뢰에 보낼 수 없습니다.</div></div>`;
  } else {
    b+=`<div class="empty">헌터를 선택하면 예상 성공률이 계산됩니다.</div>`;
  }

  const btns=[];
  if(!q.scouted)btns.push({l:`정찰 ${fmt(scoutCost(q))}G`,dis:G.gold<scoutCost(q),fn:()=>{
    G.gold-=scoutCost(q);q.scouted=true;
    const bad=q.hz.filter(h=>h.bad).length;
    push(`🔍 「${q.name}」 정찰 완료 — ${q.hz.length?(bad?'위험 요소 '+bad+'건 발견':'유리한 변수 발견'):'특이사항 없음'}`,bad?'bad':'good');
    save();mQuest(id);
  }});
  btns.push({l:`파견 (${party.length}/${maxParty()})`,p:1,dis:!party.length,fn:()=>tryDispatch(q,party)});
  btns.push({l:'닫기',fn:()=>{SEL=[];closeM();}});
  modal(`${QT[q.type].ic} ${esc(q.name)}`,`${q.type} 의뢰`,b,btns);
}

function tryDispatch(q,party){
  const refs=[];
  party.forEach(h=>{const r=refusal(h,q);if(r)refs.push({h,r});});
  if(!refs.length){SEL=[];dispatch(q,party);closeM();save();render();toast('파견했습니다.');return;}
  const bribes=refs.filter(x=>x.r.bribe);
  const hard=refs.filter(x=>!x.r.bribe);
  let b='';
  refs.forEach(x=>b+=`<div class="warn"><b>${esc(x.h.name)}</b><br>${x.r.r}</div>`);
  const total=bribes.reduce((a,x)=>a+x.r.bribe,0);
  if(hard.length){
    b+=`<div class="note">거절한 헌터를 빼고 보내거나, 편성을 다시 짜야 합니다.</div>`;
  } else {
    b+=`<div class="note">추가 수당 <b class="money">${fmt(total)}G</b>를 지급하면 응합니다.</div>`;
  }
  const rest=party.filter(h=>!refs.some(x=>x.h.id===h.id));
  const btns=[];
  if(!hard.length)btns.push({l:`수당 지급 · ${fmt(total)}G`,p:1,dis:G.gold<total,fn:()=>{
    SEL=[];dispatch(q,party,total);closeM();save();render();toast('수당을 주고 파견했습니다.');
  }});
  if(rest.length)btns.push({l:`${rest.length}명만 파견`,p:hard.length?1:0,fn:()=>{
    SEL=[];dispatch(q,rest);closeM();save();render();toast('일부만 파견했습니다.');
  }});
  btns.push({l:'편성 다시',fn:()=>mQuest(q.id)});
  modal('거절당했습니다','헌터는 성격과 특성에 따라 의뢰를 거부합니다',b,btns);
}

/* ── 결산 ── */
function showSettle(list,days){
  if(days>0){
    G.settleCache=list.concat(G.settleCache||[]).slice(0,10);
    save();
  }
  let b=`<div class="note" style="margin-bottom:11px">${days}일이 지났고, 파견이 ${list.length}건 복귀했습니다.</div>`;
  list.forEach(q=>{
    const r=q.result;
    const col=r.res==='실패'?'var(--blood)':r.res==='대성공'?'var(--brass)':'var(--moss)';
    b+=`<div style="background:var(--panel2);border:1px solid var(--line);border-left:3px solid ${col};padding:11px;margin-bottom:8px;border-radius:0 3px 3px 0">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
        <b style="font-size:14px">${esc(q.name)}</b>
        <span style="color:${col};font-weight:700;font-size:13px">${r.res}</span></div>
      <div class="tiny" style="margin-top:2px">${r.party.join(', ')}</div>
      <div style="margin-top:6px;font-size:13px">${r.gold>0?`<span class="money">+${fmt(r.gold)}G</span>`:'<span class="neg">보상 없음</span>'}</div>`;
    r.lvups.forEach(l=>b+=`<div class="tiny" style="color:var(--moss);margin-top:3px">📈 ${l.h.name} Lv.${l.h.lv} 달성 — ${Object.keys(l.g).map(k=>STATN[k]+' +'+l.g[k]).join(', ')||'성장 한계'}</div>`);
    r.inj.forEach(i=>b+=`<div class="tiny" style="color:var(--blood);margin-top:3px">⚠️ ${i.h.name} ${INJ[i.t].n} (${i.d}일)</div>`);
    b+=`<div style="margin-top:7px"><button data-act="repq" data-id="${q.id}" style="font-size:11.5px;color:var(--brass);border-bottom:1px solid var(--brass-d);padding:0">판정서 보기</button></div></div>`;
  });
  SETTLE=list;
  modal('의뢰 결산','',b,[{l:'확인',p:1,fn:()=>{closeM();if(G.queue.length)nextQueue();else{render();}}}],true);
}
let SETTLE=[];

function mReport(q){
  const r=q.result;const ev=r.ev;
  const col=r.res==='실패'?'var(--blood)':r.res==='대성공'?'var(--brass)':'var(--moss)';
  let b=`<div class="tiny" style="margin-bottom:8px">${r.party.join(', ')} · ${ev.days}일 원정</div>`;
  b+=storyHTML(r.story);
  b+=`<div class="tiny" style="margin:16px 0 5px">판정 내역</div>`;
  ev.L.forEach(l=>b+=`<div class="rep-l ${l.k}"><span class="lb">${l.l}</span><span class="vl">${l.v}</span></div>`);
  b+=`<div class="final"><span>최종 성공 확률</span><span class="big" style="color:${col}">${ev.p}% → ${r.res}</span></div>`;
  if(q.sent.est!==ev.p){
    const gap=ev.p-q.sent.est;
    b+=`<div class="hint" style="border-left-color:${gap<0?'var(--blood)':'var(--moss)'}">
      출발 전 예측은 <b>${q.sent.est}%</b>였습니다. 실제는 <b>${ev.p}%</b>.
      ${gap<0?'정찰하지 않아 숨은 위험을 놓쳤습니다.':'예상보다 유리한 변수가 있었습니다.'}</div>`;
  }
  r.inj.forEach(i=>b+=`<div class="hint" style="border-left-color:var(--blood);margin-top:8px">
    <b>⚠️ ${i.h.name} ${INJ[i.t].n} · ${i.d}일 이탈</b><br>${i.why}</div>`);
  if(r.res==='실패'){
    const worst=ev.L.filter(l=>l.k==='n').sort((a,b2)=>parseFloat(a.v)-parseFloat(b2.v))[0];
    if(worst)b+=`<div class="hint" style="border-left-color:var(--brass);margin-top:8px">
      <b>다음에 바꿀 것</b><br>가장 큰 감점 요인은 「${worst.l}」(${worst.v})였습니다.</div>`;
  }
  modal('판정서',esc(q.name),b,[{l:'닫기',fn:()=>{if(SETTLE.length)showSettle(SETTLE,0);else closeM();}}]);
}

/* ── 대기열(결정) ── */
function nextQueue(){
  if(!G.queue.length){render();return;}
  const e=G.queue[0];
  const done=()=>{G.queue.shift();save();if(G.queue.length)nextQueue();else{closeM();render();}};
  // ── 위협 예고 ──
  if(e.type==='threat'){
    const t=G.threat;
    if(!t||t.done){done();return;}
    const q=G.quests.find(x=>x.id===t.qid);
    modal(`${t.ic} 위기 예고`,`${t.day-G.day}일 뒤 발생 · ${esc(t.place)}`,
      `<div class="threat" style="margin:0 0 12px">
        <div class="th"><span class="tn">${esc(t.name)}</span><span class="td">D-${t.day-G.day}</span></div>
        <div class="tb">${esc(t.desc)}</div></div>
       <div class="rep-l"><span class="lb">난이도</span><span class="vl">${stars(t.d)}</span></div>
       <div class="rep-l"><span class="lb">요구 전투력</span><span class="vl">${q?q.reqPow:'-'}</span></div>
       <div class="rep-l"><span class="lb">원정 기간</span><span class="vl">${q?q.days+'일':'-'}</span></div>
       <div class="rep-l"><span class="lb">성공 보상</span><span class="vl money">${fmt(t.reward)}G + ${REPN[t.rep]} 대폭 상승</span></div>
       <div class="rep-l n"><span class="lb">실패 시</span><span class="vl">자금 ${Math.round(t.penGold*100)}% 배상 · ${REPN[t.rep]} -${t.penRep}</span></div>
       <div class="hint" style="border-left-color:var(--blood)">
       게시판 맨 위에 대응 의뢰가 걸렸습니다. <b>발생일까지 원정을 끝내야</b> 합니다.
       ${q?`${q.days}일 걸리니 늦어도 ${t.day-G.day-q.days}일 안에 파견하세요.`:''}</div>`,
      [{l:'게시판으로',p:1,fn:()=>{G.queue.shift();save();closeM();TAB='quests';render();}},
       {l:'확인',fn:done}],true);
    return;
  }
  if(e.type==='threatWin'){
    const t=G.threat;
    modal(`${t.ic} 위기 저지`,esc(t.name),
      `<div class="hint good" style="background:#1E2B1B;border-left-color:var(--moss);color:#A9CE97">
        기한 안에 막아냈습니다. 왕국과 주민들이 우리 길드를 주목하고 있습니다.</div>
       <div class="rep-l p"><span class="lb">${REPN[t.rep]}</span><span class="vl">+${t.repGain||Math.round(t.d*4.5)}</span></div>
       <div class="rep-l p"><span class="lb">길드 점수</span><span class="vl">+${Math.round(t.d*t.d*1.6)}</span></div>
       <div class="rep-l p"><span class="lb">전원 충성도</span><span class="vl">+4</span></div>`,
      [{l:'좋다',p:1,fn:done}],true);
    return;
  }
  if(e.type==='threatFail'){
    const t=G.threat;
    modal(`${t.ic} 대응 실패`,esc(t.name),
      `<div class="warn">${esc(t.fail)}</div>
       <div class="rep-l n"><span class="lb">배상금</span><span class="vl">-${fmt(t.loss||0)}G</span></div>
       <div class="rep-l n"><span class="lb">${REPN[t.rep]}</span><span class="vl">-${t.penRep}</span></div>
       <div class="rep-l n"><span class="lb">전원 충성도</span><span class="vl">-5</span></div>
       <div class="rep-l n"><span class="lb">${esc(t.rival||'라이벌')} 길드</span><span class="vl">세력 +5%</span></div>
       <div class="hint">우리가 못 막은 일은 다른 길드가 대신 처리합니다. 그만큼 격차가 벌어집니다.</div>`,
      [{l:'확인',p:1,fn:done}],true);
    return;
  }
  // ── 현장 판단 ──
  if(e.type==='field'){ mField(e.qid,done); return; }
  // ── 월말 결산 ──
  if(e.type==='monthly'){ mMonthly(done); return; }

  const h=G.hunters.find(x=>x.id===e.hid);
  if(!h){done();return;}

  if(e.type==='poach'){
    const need=Math.round(h.offer.salary*(1.06-h.loyalty/450));
    const bonus=Math.round(need*3.2);
    modal('영입 제안',`${esc(h.name)} · 계약 D-${h.contract}`,
      `<div class="warn">📨 <b>${h.offer.g}</b> 길드가 주급 <b>${fmt(h.offer.salary)}G</b>를 제시했습니다.<br>현재 우리 길드 주급은 ${fmt(h.salary)}G입니다.</div>
       <div class="rep-l"><span class="lb">전투력</span><span class="vl">${power(h)}</span></div>
       <div class="rep-l"><span class="lb">충성도</span><span class="vl" style="color:${h.loyalty<50?'var(--blood)':''}">${h.loyalty}</span></div>
       <div class="rep-l"><span class="lb">잔여 계약</span><span class="vl">${h.contract}일</span></div>
       <div class="hint">붙잡으려면 주급 <b class="money">${fmt(need)}G</b> + 계약금 <b class="money">${fmt(bonus)}G</b>가 필요합니다.
       충성도가 높을수록 요구가 낮아집니다.</div>`,
      [{l:`재계약 ${fmt(bonus)}G`,p:1,dis:G.gold<bonus,fn:()=>{
        G.gold-=bonus;h.salary=need;h.contract+=ri(180,300);h.offer=null;h.loyalty=cl(h.loyalty+12,0,100);
        push(`✍️ ${h.name} 재계약 (주급 ${fmt(need)}G)`,'good');done();
      }},{l:'보낸다',fn:()=>{
        h.loyalty=cl(h.loyalty-18,0,100);h.offer.decided=1;
        push(`${h.name}이(가) 재계약 거절 통보를 받았습니다. 계약 만료 시 떠납니다.`,'bad');done();
      }}],true);
  }
  else if(e.type==='retire'){
    const cost=Math.round(h.salary*0.6);
    const tr=h.traits.filter(t=>TRAITS[t].g)[0]||null;
    modal('은퇴 의사',`${esc(h.name)} · ${h.age}세`,
      `<div class="hint">"${h.name}: 이제 몸이 안 따라줍니다. 물러날 때가 된 것 같습니다."</div>
       <div class="rep-l"><span class="lb">통산</span><span class="vl">의뢰 ${h.quests}건 · 성공 ${h.wins}건</span></div>
       <div class="rep-l"><span class="lb">최종 전투력</span><span class="vl">${power(h)}</span></div>
       <div class="hint" style="border-left-color:var(--brass)">교관으로 남기면 주급 <b class="money">${fmt(cost)}G</b>에
       훈련 효과 +6%${tr?`, 신입에게 <b>${TRAITS[tr].ic} ${tr}</b> 특성을 전수할 확률`:''}이 생깁니다.</div>`,
      [{l:'교관으로',p:1,fn:()=>{
        G.inst.push({name:h.name,cls:h.cls,salary:cost,trait:tr});
        G.hunters=G.hunters.filter(x=>x.id!==h.id);
        push(`🎓 ${ga(h.name)} 은퇴하고 훈련장 교관이 되었습니다.`,'good');done();
      }},{l:'보내드린다',fn:()=>{
        G.hunters=G.hunters.filter(x=>x.id!==h.id);
        G.moves.unshift({day:G.day,name:h.name,to:'은퇴',pw:power(h),why:'현역 은퇴'});
        push(`🫡 ${ga(h.name)} 길드를 떠났습니다. 수고했습니다.`,'info');done();
      }}],true);
  }
  else if(e.type==='quarrel'){
    const o=G.hunters.find(x=>x.id===e.oid)||h;
    modal('길드 내 마찰',`${esc(h.name)} ↔ ${esc(o.name)}`,
      `<div class="hint">훈련장에서 두 사람이 크게 다투었습니다. 다른 헌터들이 지켜보고 있습니다.</div>`,
      [{l:'중재한다',p:1,fn:()=>{
        if(chance(62)){h.loyalty=cl(h.loyalty+7,0,100);o.loyalty=cl(o.loyalty+7,0,100);
          addRel(h.id,o.id,18);push(`🤝 ${gwa(h.name)} ${ga(o.name)} 화해했습니다.`,'good');}
        else{h.loyalty=cl(h.loyalty-4,0,100);addRel(h.id,o.id,-6);push(`중재가 잘 되지 않았습니다.`,'bad');}done();
      }},{l:'한쪽을 편든다',fn:()=>{
        h.loyalty=cl(h.loyalty+11,0,100);o.loyalty=cl(o.loyalty-14,0,100);addRel(h.id,o.id,-24);
        push(`${h.name}의 편을 들었습니다. ${ga(o.name)} 불만을 품었습니다.`,'bad');done();
      }},{l:'내버려둔다',fn:()=>{
        h.loyalty=cl(h.loyalty-5,0,100);o.loyalty=cl(o.loyalty-5,0,100);addRel(h.id,o.id,-14);
        push(`마찰을 방치했습니다. 분위기가 나빠졌습니다.`,'bad');done();
      }}],true);
  }
  else if(e.type==='complain'){
    const raise=Math.round(h.salary*0.3);
    modal('불만 제기',esc(h.name),
      `<div class="hint">"${h.name}: 제 대우가 이게 맞습니까. 다른 길드는 훨씬 준다던데요."</div>
       <div class="rep-l"><span class="lb">현재 충성도</span><span class="vl neg">${h.loyalty}</span></div>`,
      [{l:`주급 인상 ${fmt(raise)}G`,p:1,fn:()=>{
        h.salary+=raise;h.loyalty=cl(h.loyalty+20,0,100);push(`${h.name}의 주급을 올렸습니다.`,'info');done();
      }},{l:'설득한다',fn:()=>{
        if(chance(45)){h.loyalty=cl(h.loyalty+10,0,100);push(`${eul(h.name)} 설득했습니다.`,'good');}
        else{h.loyalty=cl(h.loyalty-8,0,100);push(`${ga(h.name)} 납득하지 못했습니다.`,'bad');}done();
      }},{l:'무시',fn:()=>{h.loyalty=cl(h.loyalty-12,0,100);done();}}],true);
  }
  else if(e.type==='burnout'){
    modal('과로 경고',esc(h.name),
      `<div class="warn">피로도 ${Math.round(h.fatigue)}%. 계속 굴리면 부상 확률이 크게 오릅니다.</div>`,
      [{l:'3일 강제 휴식',p:1,dis:!!h.busy,fn:()=>{
        h.loyalty=cl(h.loyalty+8,0,100);
        h.busy={type:'rest'};h.until=G.day+3;
        push(`${h.name}에게 3일 휴식을 지시했습니다.`,'good');done();
      }},{l:'계속 쓴다',fn:()=>{h.loyalty=cl(h.loyalty-9,0,100);push(`${ga(h.name)} 불만을 품었습니다.`,'bad');done();}}],true);
  }
  else if(e.type==='ask'){
    const k=pick(SKEYS);
    modal('개인 요청',esc(h.name),
      `<div class="hint">"${h.name}: ${STATN[k]} 쪽을 더 다듬고 싶습니다. 시간을 좀 주십시오."</div>
       <div class="note">허락하면 3일간 자율 훈련합니다. 그동안 의뢰에 나갈 수 없습니다.</div>`,
      [{l:'허락',p:1,dis:!!h.busy,fn:()=>{
        h.busy={type:'train',stat:k,days:3};h.until=G.day+3;h.loyalty=cl(h.loyalty+9,0,100);
        push(`${ga(h.name)} 자율 훈련에 들어갔습니다.`,'info');done();
      }},{l:'지금은 안 된다',fn:()=>{h.loyalty=cl(h.loyalty-4,0,100);done();}}],true);
  }
  else done();
}

/* ── 현장 판단 ── */
function mField(qid,done){
  const q=(G.active||[]).find(x=>x.id===qid);
  if(!q){done();return;}
  const F=FIELD[q.field.fid];
  const party=q.sent.ids.map(i=>G.hunters.find(h=>h.id===i)).filter(Boolean);
  if(!F||!party.length){done();return;}
  const statOf=(k,m)=>m==='best'?Math.max(...party.map(h=>eff(h,k)))
                                :Math.round(party.reduce((a,h)=>a+eff(h,k),0)/party.length);
  const met=o=>{
    if(!o.req)return true;
    if(o.req.t)return party.some(h=>h.traits.includes(o.req.t));
    return statOf(o.req.k,o.req.m)>=o.req.v;
  };
  let b=`<div class="hint" style="border-left-color:var(--brass);margin-top:0">${esc(F.d)}</div>
    <div class="tiny" style="margin:11px 0 6px">${party.map(h=>esc(h.name)).join(', ')} · 복귀까지 ${Math.max(0,q.sent.end-G.day)}일</div>`;
  F.o.forEach((o,i)=>{
    const ok=met(o);
    let tag='';
    if(o.req){
      const need=o.req.t?`${TRAITS[o.req.t].ic} ${o.req.t} 보유`
                        :`${STATN[o.req.k]} ${o.req.m==='best'?'최고':'평균'} ${o.req.v}`;
      const cur=o.req.t?'':` (현재 ${statOf(o.req.k,o.req.m)})`;
      tag=`<span class="tag ${ok?'g':'b'}">${need}${ok?'':cur}</span>`;
    }
    b+=`<button class="pick ${ok?'':'off'}" data-act="fld" data-i="${i}" ${ok?'':'disabled'}
        style="align-items:flex-start;flex-direction:column;gap:3px">
      <span style="display:flex;width:100%;gap:8px;align-items:center">
        <span style="flex:1;font-weight:600">${esc(o.t)}</span>${tag}</span>
      <span class="tiny">${esc(o.d)}</span></button>`;
  });
  FIELDQ={q,F,party,done,met};
  modal(`${F.ic} ${esc(F.n)}`,esc(q.name),b,[],true);
}
let FIELDQ=null;
function fieldPick(i){
  if(!FIELDQ)return;
  const {q,F,party,done}=FIELDQ;
  const o=F.o[i];
  q.mods=q.mods||{flat:0,days:0,inj:0,rew:1};
  q.mods.flat+=o.m.flat||0;
  q.mods.days+=o.m.days||0;
  q.mods.inj+=o.m.inj||0;
  q.mods.rew*=o.m.rew||1;
  q.mods.label=o.t;
  q.mods.story=o.s;
  q.mods.good=(o.m.flat||0)>=0;
  if(o.m.days)q.sent.end=Math.max(G.day,q.sent.end+o.m.days);
  if(o.loy)party.forEach(h=>h.loyalty=cl(h.loyalty+o.loy,0,100));
  if(o.rep){const rk=QT[q.type].rep;G.rep[rk]=cl(G.rep[rk]+o.rep,0,100);}
  if(o.relv)for(let a=0;a<party.length;a++)for(let c=a+1;c<party.length;c++)
    addRel(party[a].id,party[c].id,o.relv);
  push(`${F.ic} ${q.name} — 현장 판단: ${o.t}`,q.mods.good?'info':'bad');
  FIELDQ=null;
  done();
}

/* ── 월말 결산 ── */
function mMonthly(done){
  const M=G.mo;
  const rank=()=>{
    const l=G.rivals.map(r=>({n:r.n,p:r.p})).concat([{n:G.name,p:myPower(),me:1}]).sort((a,b)=>b.p-a.p);
    return l.findIndex(x=>x.me)+1;
  };
  const nowRank=rank(), nowPts=guildPts();
  const dRank=M.rank?M.rank-nowRank:0;
  const net=M.income-M.expense;

  // 이달의 헌터
  let mvp=null,mvpPts=0;
  for(const id in M.contrib){ if(M.contrib[id]>mvpPts){mvpPts=M.contrib[id];mvp=G.hunters.find(h=>h.id===+id);} }
  // 이달의 신인 (이달 영입 + 성장폭)
  const rookie=G.hunters.filter(h=>M.newbies.includes(h.id))
    .sort((a,b)=>b.pot-a.pot)[0];

  let b=`<div class="mrow"><span class="ml">완료 의뢰</span><span class="mv">${M.quests-M.fails}건 <span class="tiny">(실패 ${M.fails})</span></span></div>
   <div class="mrow"><span class="ml">수입</span><span class="mv money">+${fmt(M.income)}G</span></div>
   <div class="mrow"><span class="ml">급여</span><span class="mv neg">-${fmt(M.wage||0)}G</span></div>
   <div class="mrow"><span class="ml">시설 유지비</span><span class="mv neg">-${fmt(M.up||0)}G</span></div>
   <div class="mrow"><span class="ml">기타 지출</span><span class="mv neg">-${fmt(Math.max(0,M.expense-(M.wage||0)-(M.up||0)))}G</span></div>
   <div class="mrow"><span class="ml">순이익</span><span class="mv ${net>=0?'pos':'neg'}">${net>=0?'+':''}${fmt(net)}G</span></div>
   <div class="mrow"><span class="ml">길드 순위</span><span class="mv">${nowRank}위
     ${dRank>0?`<span class="pos">↑${dRank}</span>`:dRank<0?`<span class="neg">↓${-dRank}</span>`:'<span class="tiny">유지</span>'}</span></div>
   <div class="mrow"><span class="ml">길드 점수</span><span class="mv">${nowPts}점
     <span class="pos tiny">+${nowPts-(M.pts||0)}</span></span></div>`;
  if(M.threats)b+=`<div class="mrow"><span class="ml">위기 대응</span><span class="mv">${M.threatWin}/${M.threats}건 저지</span></div>`;

  b+=`<div style="margin-top:13px"><div class="tiny" style="margin-bottom:6px">명성 변화</div>`;
  for(const k in REPN){
    const d=Math.round(G.rep[k]-(M.rep[k]||0));
    b+=`<div class="mrow"><span class="ml">${REPN[k]}</span><span class="mv">${Math.round(G.rep[k])}
      <span class="${d>0?'pos':d<0?'neg':'tiny'}">${d===0?'—':sgn(d)}</span></span></div>`;
  }
  b+=`</div><div style="margin-top:14px"><div class="tiny" style="margin-bottom:6px">이달의 표창</div>`;
  if(mvp)b+=`<div class="award" style="display:flex;gap:11px;align-items:center">
    ${sigil(mvp,40)}<div><div class="al">이달의 헌터</div>
    <div class="an">${esc(mvp.name)}</div>
    <div class="ad">${mvp.cls} Lv.${mvp.lv} · 전투력 ${power(mvp)} · 기여도 ${Math.round(mvpPts)}</div></div></div>`;
  if(rookie)b+=`<div class="award" style="border-left-color:var(--moss);display:flex;gap:11px;align-items:center">
    ${sigil(rookie,40)}<div><div class="al" style="color:var(--moss)">이달의 신인</div>
    <div class="an">${esc(rookie.name)}</div>
    <div class="ad">${rookie.age}세 · ${potShown(rookie)}</div></div></div>`;
  if(!mvp&&!rookie)b+=`<div class="empty">이번 달은 표창할 만한 활약이 없었습니다.</div>`;

  if(G.goal)b+=`<div class="hint" style="margin-top:12px;border-left-color:${G.goal.done?'var(--moss)':'var(--blood)'}">
    <b>${G.month}개월차 과제 ${G.goal.done?'달성':'미달성'}</b><br>${esc(G.goal.txt)}</div>`;

  // 다음 달 준비
  G.month++;
  M.pts=nowPts; M.rank=nowRank;
  const prevRank=nowRank, prevPts=nowPts;
  modal(`${G.month-1}개월차 결산`,`${G.day}일차 · ${guildGrade()}급`,b,
    [{l:'다음 달로',p:1,fn:()=>{
      const prev=G.mo;
      G.mo=newMonth(); G.mo.pts=prevPts; G.mo.rank=prevRank;
      for(const k in REPN)G.mo.rep[k]=G.rep[k];
      rollGoal(prev);
      done();
    }}],true);
}

/* ── 모집 ── */
function mCand(i){
  const c=G.cands[i];if(!c)return;
  const [g,col]=gradeOf(c);
  let b=`<div style="display:flex;gap:13px;align-items:center;margin-bottom:10px">
    ${sigil(c,56)}
    <div style="flex:1"><div style="font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1">${power(c)}</div>
    <div class="tiny">전투력 · ${CLASSES[c.cls].ic} ${c.cls} Lv.${c.lv}</div></div></div>`;
  b+=`<div class="stats">`;
  SKEYS.forEach(k=>{
    const hi=CLASSES[c.cls].w[k]>=1.3;
    b+=`<div class="st ${hi?'hi':''}"><div class="sl"><span>${STATN[k]}</span><b>${c.stats[k]}</b></div>
      <div class="bar"><i style="width:${cl(c.stats[k]/99*100,2,100)}%"></i></div></div>`;
  });
  b+=`</div>
  <div class="rep-l"><span class="lb">전투력</span><span class="vl">${power(c)}</span></div>
  <div class="rep-l"><span class="lb">${potShown(c)}</span><span class="vl">정찰단 Lv.${G.fac.scout}</span></div>
  <div class="rep-l"><span class="lb">주급</span><span class="vl">${fmt(c.salary)}G</span></div>
  <div class="rep-l"><span class="lb">성격</span><span class="vl">${c.pers}</span></div>`;
  b+=`<div style="margin-top:10px">`;
  c.traits.forEach(t=>b+=`<div class="rep-l ${TRAITS[t].g?'p':'n'}"><span class="lb">${TRAITS[t].ic} ${t}</span><span class="vl" style="font-weight:400;font-size:11.5px;color:var(--dim)">${TRAITS[t].d}</span></div>`);
  b+=`</div>`;
  if(G.fac.scout<5)b+=`<div class="hint">정찰단을 올리면 잠재력을 더 정확히 볼 수 있습니다. 지금 오차 ±${FAC.scout.v[G.fac.scout-1]}.</div>`;
  const full=G.hunters.length>=maxHunters();
  if(full)b+=`<div class="warn">숙소 정원이 찼습니다 (${maxHunters()}명). 숙소를 확장하세요.</div>`;
  modal(`${CLASSES[c.cls].ic} ${esc(c.name)} <span class="tag" style="color:${col};border-color:${col};font-size:12px">${g}</span>`,
    `${c.cls} Lv.${c.lv} · ${c.age}세`,b,
    [{l:`영입 ${fmt(c.fee)}G`,p:1,dis:G.gold<c.fee||full,fn:()=>{
      G.gold-=c.fee;c.id=G.nextId++;G.hunters.push(c);G.cands.splice(i,1);seedRel(c);
      G.mo.newbies.push(c.id);G.mo.expense+=c.fee;
      push(`🤝 ${eul(c.name)} 영입했습니다.`,'good');closeM();save();render();
    }},{l:'닫기',fn:closeM}]);
}

function mResign(id){
  const h=G.hunters.find(x=>x.id===id);if(!h)return;
  const base=h.offer?h.offer.salary:Math.round(h.salary*(1.1+power(h)/500));
  const need=Math.round(base*(1.06-h.loyalty/450));
  const bonus=Math.round(need*3.2);
  modal('재계약',esc(h.name),
    `<div class="rep-l"><span class="lb">현재 주급</span><span class="vl">${fmt(h.salary)}G</span></div>
     <div class="rep-l"><span class="lb">요구 주급</span><span class="vl money">${fmt(need)}G</span></div>
     <div class="rep-l"><span class="lb">계약금</span><span class="vl money">${fmt(bonus)}G</span></div>
     <div class="rep-l"><span class="lb">충성도</span><span class="vl">${h.loyalty}</span></div>
     ${h.offer?`<div class="warn">${h.offer.g} 길드가 주급 ${fmt(h.offer.salary)}G를 제시한 상태입니다.</div>`:''}
     <div class="hint">충성도가 높으면 요구가 낮아집니다. 성격에 맞는 의뢰를 주고, 과로시키지 않으면 올라갑니다.</div>`,
    [{l:`재계약 ${fmt(bonus)}G`,p:1,dis:G.gold<bonus,fn:()=>{
      G.gold-=bonus;h.salary=need;h.contract+=ri(180,300);h.offer=null;h.loyalty=cl(h.loyalty+12,0,100);
      push(`✍️ ${h.name} 재계약 완료`,'good');closeM();save();render();
    }},{l:'취소',fn:()=>mHunter(id)}]);
}

/* ══════════════════════════════════════════════════
   이벤트 위임
   ══════════════════════════════════════════════════ */
document.addEventListener('click',ev=>{
  const mb=ev.target.closest('[data-mb]');
  if(mb){const b=MB[+mb.dataset.mb];if(b&&b.fn)b.fn();return;}
  const t=ev.target.closest('[data-tab]');
  if(t){TAB=t.dataset.tab;SEL=[];render();return;}
  const a=ev.target.closest('[data-act]');
  if(!a){
    if(ev.target.id==='mroot'&&$('#mroot').dataset.noclose!=='1'){SEL=[];closeM();}
    return;
  }
  const act=a.dataset.act;
  switch(act){
    case 'adv': advance(+a.dataset.n); break;
    case 'advret': advanceUntilReturn(); break;
    case 'queue': nextQueue(); break;
    case 'go': TAB=a.dataset.tab2; SEL=[]; render(); break;
    case 'hunter': mHunter(+a.dataset.id); break;
    case 'quest': SEL=[]; mQuest(+a.dataset.id); break;
    case 'sel': {
      const id=+a.dataset.id;
      if(SEL.includes(id))SEL=SEL.filter(x=>x!==id);
      else if(SEL.length<maxParty())SEL.push(id);
      else toast(`최대 ${maxParty()}명까지 편성할 수 있습니다.`);
      mQuestReopen();
      break;
    }
    case 'fld': fieldPick(+a.dataset.i); break;
    case 'tk': TRAINK=a.dataset.k; mTrainReopen(); break;
    case 'td': TRAIND=+a.dataset.d; mTrainReopen(); break;
    case 'equip': mEquip(+a.dataset.id,a.dataset.s); break;
    case 'doequip': {
      const h=G.hunters.find(x=>x.id===+a.dataset.id);
      const s=a.dataset.s,k=a.dataset.k;
      if(h.equip[s])G.stock.push(h.equip[s]);
      const idx=G.stock.indexOf(k);if(idx>=0)G.stock.splice(idx,1);
      h.equip[s]=k;save();mHunter(h.id);break;
    }
    case 'unequip': {
      const h=G.hunters.find(x=>x.id===+a.dataset.id);
      const s=a.dataset.s;
      if(h.equip[s]){G.stock.push(h.equip[s]);h.equip[s]=null;}
      save();mHunter(h.id);break;
    }
    case 'fac': {
      const k=a.dataset.k,lv=G.fac[k];
      if(lv>=5)break;
      const c=FAC[k].c[lv];
      if(G.gold<c)break;
      G.gold-=c;G.fac[k]++;
      push(`🏗️ ${FAC[k].n}을(를) Lv.${G.fac[k]}로 확장했습니다.`,'good');
      save();render();break;
    }
    case 'cand': mCand(+a.dataset.i); break;
    case 'reroll': if(G.gold>=500){G.gold-=500;rollCands();save();render();} break;
    case 'shopt': SHOP_T=a.dataset.t; render(); break;
    case 'buy': {
      const k=a.dataset.k;
      if(G.gold<ITEMS[k].p)break;
      G.gold-=ITEMS[k].p;G.stock.push(k);
      toast(`${ITEMS[k].n} 구입`);save();render();break;
    }
    case 'rep': {
      const l=G.log[+a.dataset.i];
      if(!l||!l.report)break;
      const q=(G.settleCache||[]).find(x=>x.id===l.q);
      if(q)mReport(q);else toast('판정서가 만료되었습니다.');
      break;
    }
    case 'repq': {
      const q=SETTLE.find(x=>x.id===+a.dataset.id);
      if(q)mReport(q);break;
    }
    case 'reset':
      modal('새로 시작','저장된 진행이 모두 사라집니다.','<div class="warn">되돌릴 수 없습니다.</div>',
        [{l:'새로 시작',p:1,fn:()=>{newGame();closeM();save();TAB='home';render();}},{l:'취소',fn:closeM}]);
      break;
  }
});
// 열려 있는 모달 재렌더 헬퍼
let OPENQ=null,OPENTR=null;
function mQuestReopen(){if(OPENQ!=null)mQuest(OPENQ);}
function mTrainReopen(){if(OPENTR!=null)mTrain(OPENTR);}
const _mQuest=mQuest;mQuest=function(id){OPENQ=id;OPENTR=null;_mQuest(id);};
const _mTrain=mTrain;mTrain=function(id){OPENTR=id;OPENQ=null;_mTrain(id);};
const _closeM=closeM;closeM=function(){OPENQ=null;OPENTR=null;TRAINK=null;_closeM();};

/* ══════════════════════════════════════════════════
   저장 (window.storage → localStorage → 메모리)
   ══════════════════════════════════════════════════ */
const MEM={};
const KEY='hgm_save_v2';
async function rawGet(k){
  if(typeof window!=='undefined'&&window.storage&&window.storage.get){
    try{const r=await window.storage.get(k);return r?r.value:null;}catch(e){}
  }
  try{return localStorage.getItem(k);}catch(e){return MEM[k]??null;}
}
async function rawSet(k,v){
  if(typeof window!=='undefined'&&window.storage&&window.storage.set){
    try{await window.storage.set(k,v);return;}catch(e){}
  }
  try{localStorage.setItem(k,v);}catch(e){MEM[k]=v;}
}
function save(){
  try{
    const c=JSON.parse(JSON.stringify(G));
    // 판정서 캐시 (최근 8건)
    c.settleCache=(G.settleCache||[]).slice(0,8);
    rawSet(KEY,JSON.stringify(c));
  }catch(e){}
}
async function load(){
  const s=await rawGet(KEY);
  if(!s)return false;
  try{
    const d=JSON.parse(s);
    if(!d||!d.hunters||!d.day)return false;
    G=d;
    G.active=G.active||[];G.queue=G.queue||[];G.moves=G.moves||[];
    G.inst=G.inst||[];G.settleCache=G.settleCache||[];
    return true;
  }catch(e){return false;}
}

/* ══════════════════════════════════════════════════
   시작
   ══════════════════════════════════════════════════ */

  const ok=await load();

    modal('변방 길드 인수',`${G.day}일차 · F급`,
      `<div class="note" style="line-height:1.65">
      폐업 직전의 길드를 넘겨받았습니다. 헌터 4명과 6,000G가 전부입니다.<br><br>

      ① <b style="color:var(--text)">의뢰에는 소요일이 있습니다.</b> 에이스를 5일짜리 원정에 보내면, 내일 뜨는 대형 의뢰에는 못 씁니다.<br><br>
      ② <b style="color:var(--text)">게시판 정보는 부정확합니다.</b> 돈을 내고 정찰하면 진짜 난이도와 숨은 변수를 봅니다. 나쁜 것만 나오는 건 아닙니다.<br><br>

      ④ <b style="color:var(--text)">주기적으로 위기가 예고됩니다.</b> 기한 안에 원정을 끝내야 막을 수 있습니다. 놓치면 배상금과 명성 하락이 따라오고, 그 일은 라이벌 길드가 대신 처리합니다.<br><br>
      <span style="color:var(--dim2)">접속하지 않는 동안 시간은 흐르지 않습니다. 자동으로 진행되는 것은 아무것도 없습니다.</span>
      </div>`,
      [{l:'시작',p:1,fn:closeM}]);
  }
})();
